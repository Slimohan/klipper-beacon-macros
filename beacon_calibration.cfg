# beacon_calibration.cfg
#
# Beacon calibration macros:
#   BEACON_FULL_CALIBRATE                 one command that runs everything below and saves
#   BEACON_INITIAL_CALIBRATION            contact calibration and model on a cold bed
#   BEACON_FINAL_CALIBRATION              contact calibration and model on a hot bed
#   BEACON_POKE_TEST                      checks the mechanical noise of the contact probe
#   BEACON_CALIBRATE_NOZZLE_TEMP_OFFSET   measures hotend thermal expansion
#   BEACON_MEASURE_BEACON_OFFSET          compares scan and contact readings across the bed
#
# Based on the Beacon macros of RatOS (GPL-3.0). See README.md.

# ---------------------------------------------------------------------------
# Full calibration
# ---------------------------------------------------------------------------
[gcode_macro BEACON_FULL_CALIBRATE]
description: Complete Beacon calibration. BED_TEMP=85 CHAMBER_TEMP=0. Finishes with SAVE_CONFIG, which restarts Klipper.
gcode:
    {% set s = printer["gcode_macro _BEACON_SETTINGS"] %}
    {% set bed_temp = params.BED_TEMP|default(85)|int %}
    {% set chamber_temp = params.CHAMBER_TEMP|default(0)|int %}
    {% set true_zero = s.beacon_contact_start_print_true_zero|string|lower == 'true' %}

    # fail early, before the long calibration steps
    {% if s.beacon_scan_compensation_enable|string|lower == 'true' and true_zero and printer["gcode_macro BEACON_CREATE_SCAN_COMPENSATION_MESH"] is not defined %}
        { action_raise_error("Scan compensation is enabled but beacon_extras.cfg is not included. See README.md, section Extras.") }
    {% endif %}

    # contact calibration on a cold bed
    BEACON_INITIAL_CALIBRATION _AUTOMATED=1

    # poke test and thermal expansion are only needed for the true zero workflow
    {% if true_zero %}
        BEACON_POKE_TEST _AUTOMATED=1
        _BEACON_CHECK_POKE
        BEACON_CALIBRATE_NOZZLE_TEMP_OFFSET _AUTOMATED=1
    {% endif %}

    # scan compensation mesh (optional extra, needs the beacon_scan_compensation module)
    {% set scan_comp = s.beacon_scan_compensation_enable|string|lower == 'true' %}
    {% set already_heated = False %}
    {% if scan_comp and not true_zero %}
        _BEACON_ECHO TYPE=warning MSG="Scan compensation needs the true zero workflow (beacon_contact_start_print_true_zero), no compensation mesh is created."
    {% elif scan_comp %}
        BEACON_CREATE_SCAN_COMPENSATION_MESH _AUTOMATED=1 BED_TEMP={bed_temp} CHAMBER_TEMP={chamber_temp}
        {% set already_heated = True %}
    {% endif %}

    # contact calibration on a hot bed (skipped when a model is calibrated at every true zero)
    BEACON_FINAL_CALIBRATION _AUTOMATED=1 _AUTOMATED_ALREADY_HEATED={already_heated} BED_TEMP={bed_temp} CHAMBER_TEMP={chamber_temp}

    # heaters off
    SET_HEATER_TEMPERATURE HEATER={s.extruder} TARGET=0
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0
    {% if chamber_temp > 0 %}
        _BEACON_HOOK_CHAMBER_OFF
    {% endif %}

    {% if true_zero %}
        _BEACON_ECHO_NOZZLE_TEMP_OFFSETS
        _BEACON_ECHO_POKE
    {% endif %}
    _BEACON_ECHO TYPE=success MSG="Beacon calibration finished!"
    _BEACON_HOOK_LED_END

    _BEACON_ECHO MSG="Saving config and restarting Klipper..."
    SAVE_CONFIG

[gcode_macro BEACON_INITIAL_CALIBRATION]
description: Contact calibration of the Beacon on a cold bed. Creates a Beacon model.
gcode:
    {% set automated = params._AUTOMATED|default('0')|string|lower in ['1', 'true', 'yes'] %}

    # home x and y if not homed already
    _BEACON_MAYBE_HOME X=1 Y=1

    _BEACON_HOOK_LED_START
    G90

    # go to the safe home position and calibrate
    _BEACON_MOVE_TO_SAFE_Z_HOME
    BEACON_AUTO_CALIBRATE SKIP_MULTIPOINT_PROBING=1

    # raise to a safe height
    _BEACON_Z_HOP

    _BEACON_ECHO MSG="Initial beacon contact calibration finished!"
    {% if not automated %}
        _BEACON_ECHO TYPE=info MSG="Run SAVE_CONFIG to keep the new Beacon model."
        _BEACON_HOOK_LED_END
    {% endif %}

[gcode_macro BEACON_FINAL_CALIBRATION]
description: Contact calibration after heating the bed and nozzle to reference conditions. BED_TEMP=85 CHAMBER_TEMP=0 FORCE=1
gcode:
    {% set s = printer["gcode_macro _BEACON_SETTINGS"] %}
    {% set bed_temp = params.BED_TEMP|default(85)|int %}
    {% set chamber_temp = params.CHAMBER_TEMP|default(0)|int %}
    {% set automated = params._AUTOMATED|default('0')|string|lower in ['1', 'true', 'yes'] %}
    {% set force = params.FORCE|default('0')|string|lower in ['1', 'true', 'yes'] %}
    {% set true_zero = s.beacon_contact_start_print_true_zero|string|lower == 'true' %}
    {% set model_on_true_zero = s.beacon_contact_calibrate_model_on_true_zero|string|lower == 'true' %}
    {% set cal_temp = s.beacon_calibration_extruder_temp|int %}
    {% set bed_heat_soak_time = s.bed_heat_soak_time|int %}
    {% set already_heated = params._AUTOMATED_ALREADY_HEATED|default('0')|string|lower in ['1', 'true', 'yes'] %}
    {% set have_soak = printer["gcode_macro BEACON_HEAT_SOAK"] is defined %}

    {% if true_zero and model_on_true_zero and not force %}
        _BEACON_ECHO MSG="BEACON_FINAL_CALIBRATION skipped, a model is calibrated at every true zero. Use FORCE=1 to run it anyway."
    {% else %}
        # home and level if needed
        _BEACON_HOME_AND_ABL

        {% if chamber_temp > 0 %}
            _BEACON_HOOK_CHAMBER_ON CHAMBER_TEMP={chamber_temp}
        {% endif %}

        _BEACON_HOOK_LED_START
        G90

        # lower the toolhead to the soaking height
        {% if 'z' in printer.toolhead.homed_axes %}
            G0 Z2.5 F{s.z_hop_speed|float * 60}
        {% endif %}

        {% if not already_heated %}
            _BEACON_ECHO MSG="Waiting for calibration temperature..."
            SET_HEATER_TEMPERATURE HEATER={s.extruder} TARGET={cal_temp}
            SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bed_temp}
            TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed_temp} MAXIMUM={bed_temp + 5}
            TEMPERATURE_WAIT SENSOR={s.extruder} MINIMUM={cal_temp} MAXIMUM={cal_temp + 5}

            # wait for bed thermal expansion
            {% if have_soak %}
                BEACON_HEAT_SOAK _FORCE_THRESHOLD=100 _MIN_MAX_WAIT=3600
            {% elif bed_heat_soak_time > 0 %}
                _BEACON_ECHO MSG="Heat soaking bed for {bed_heat_soak_time} seconds..."
                G4 P{bed_heat_soak_time * 1000}
            {% endif %}
        {% endif %}

        # safe height before calibration, then calibrate
        _BEACON_Z_HOP
        BEACON_AUTO_CALIBRATE SKIP_MULTIPOINT_PROBING=1

        # heaters off when run on its own
        {% if not automated %}
            SET_HEATER_TEMPERATURE HEATER={s.extruder} TARGET=0
            SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0
            {% if chamber_temp > 0 %}
                _BEACON_HOOK_CHAMBER_OFF
            {% endif %}
        {% endif %}

        _BEACON_Z_HOP

        _BEACON_ECHO MSG="Final beacon contact calibration finished!"
        {% if not automated %}
            _BEACON_ECHO TYPE=info MSG="Run SAVE_CONFIG to keep the new Beacon model."
            _BEACON_HOOK_LED_END
        {% endif %}
    {% endif %}

# ---------------------------------------------------------------------------
# Poke test
# ---------------------------------------------------------------------------
[gcode_macro BEACON_POKE_TEST]
description: Pokes the bed five times with the contact probe and rates the latency noise
variable_poke_result_1: -1
variable_poke_result_2: -1
variable_poke_result_3: -1
variable_poke_result_4: -1
variable_poke_result_5: -1
gcode:
    {% set s = printer["gcode_macro _BEACON_SETTINGS"] %}
    {% set automated = params._AUTOMATED|default('0')|string|lower in ['1', 'true', 'yes'] %}

    # reset results
    SET_GCODE_VARIABLE MACRO=BEACON_POKE_TEST VARIABLE=poke_result_1 VALUE=-1
    SET_GCODE_VARIABLE MACRO=BEACON_POKE_TEST VARIABLE=poke_result_2 VALUE=-1
    SET_GCODE_VARIABLE MACRO=BEACON_POKE_TEST VARIABLE=poke_result_3 VALUE=-1
    SET_GCODE_VARIABLE MACRO=BEACON_POKE_TEST VARIABLE=poke_result_4 VALUE=-1
    SET_GCODE_VARIABLE MACRO=BEACON_POKE_TEST VARIABLE=poke_result_5 VALUE=-1

    # home and level if needed
    _BEACON_HOME_AND_ABL

    _BEACON_HOOK_LED_START

    # lower to the poking height
    G90
    G0 Z5 F{s.z_hop_speed|float * 60}

    # poke the bed
    _BEACON_PROBE_POKE
    _BEACON_STORE_POKE I=1
    _BEACON_PROBE_POKE
    _BEACON_STORE_POKE I=2
    _BEACON_PROBE_POKE
    _BEACON_STORE_POKE I=3
    _BEACON_PROBE_POKE
    _BEACON_STORE_POKE I=4
    _BEACON_PROBE_POKE
    _BEACON_STORE_POKE I=5

    _BEACON_Z_HOP

    _BEACON_ECHO MSG="Beacon poke test finished!"
    {% if not automated %}
        _BEACON_ECHO_POKE
        _BEACON_HOOK_LED_END
    {% endif %}

[gcode_macro _BEACON_PROBE_POKE]
gcode:
    {% set poke_bottom = printer["gcode_macro _BEACON_SETTINGS"].beacon_contact_poke_bottom_limit|float %}
    BEACON_POKE SPEED=3 TOP=5 BOTTOM={poke_bottom}
    BEACON_QUERY

[gcode_macro _BEACON_STORE_POKE]
gcode:
    {% set i = params.I|default(1)|int %}
    {% set result = printer.beacon.last_poke_result %}
    {% if result is not none and result.error == 0 %}
        SET_GCODE_VARIABLE MACRO=BEACON_POKE_TEST VARIABLE={"poke_result_%s" % i} VALUE={result.latency}
    {% endif %}

[gcode_macro _BEACON_CHECK_POKE]
description: Raises an error when the poke test failed or the average latency is too high
gcode:
    {% set p = printer["gcode_macro BEACON_POKE_TEST"] %}
    {% set results = [p.poke_result_1|int, p.poke_result_2|int, p.poke_result_3|int, p.poke_result_4|int, p.poke_result_5|int] %}

    {% if -1 in results %}
        _BEACON_HOOK_LED_ERROR
        { action_raise_error("Beacon poke test error!") }
    {% endif %}

    {% if (results|sum) / 5 > 6 %}
        _BEACON_HOOK_LED_ERROR
        { action_raise_error("Beacon poke test failed!") }
    {% endif %}

[gcode_macro _BEACON_ECHO_POKE]
gcode:
    {% set p = printer["gcode_macro BEACON_POKE_TEST"] %}
    {% set results = [p.poke_result_1|int, p.poke_result_2|int, p.poke_result_3|int, p.poke_result_4|int, p.poke_result_5|int] %}
    {% set avg = (results|sum) / 5 %}

    {% if avg <= 1 %}
        {% set type = "success" %}
        {% set note = "Extremely low noise, rarely achieved" %}
    {% elif avg <= 4 %}
        {% set type = "info" %}
        {% set note = "Excellent performance for a typical printer" %}
    {% elif avg <= 8 %}
        {% set type = "warning" %}
        {% set note = "Acceptable performance, machine may have considerable cyclic axis noise" %}
    {% elif avg <= 11 %}
        {% set type = "alert" %}
        {% set note = "Not ideal, may want to verify proper mounting or use thinner stackups" %}
    {% else %}
        {% set type = "alert" %}
        {% set note = "Reason for concern, present setup may be risky to continue with" %}
    {% endif %}

    _BEACON_ECHO TITLE="Beacon poke test result" TYPE={type} MSG="Average latency: {'%.2f' % avg}_N_{note}"

# ---------------------------------------------------------------------------
# Nozzle temperature offset (hotend thermal expansion) calibration
#
# Measures the contact trigger height at a low and a high nozzle temperature and
# stores the difference per 100 degrees in the save_variables file as
# nozzle_expansion_coefficient_t0. Needs a [save_variables] section.
# ---------------------------------------------------------------------------
[gcode_macro BEACON_CALIBRATE_NOZZLE_TEMP_OFFSET]
description: Measure hotend thermal expansion with contact probing at two nozzle temperatures
variable_reference_z: 0.0
gcode:
    {% set s = printer["gcode_macro _BEACON_SETTINGS"] %}
    {% set automated = params._AUTOMATED|default('0')|string|lower in ['1', 'true', 'yes'] %}
    {% set true_zero = s.beacon_contact_start_print_true_zero|string|lower == 'true' %}
    {% set low = s.beacon_contact_expansion_cal_temp_low|int %}
    {% set high = s.beacon_contact_expansion_cal_temp_high|int %}
    {% set poke_bottom = s.beacon_contact_poke_bottom_limit|float %}
    {% set max_temp = printer.configfile.settings.beacon.contact_max_hotend_temperature|default(180)|float %}

    {% if not true_zero %}
        _BEACON_ECHO TYPE=warning MSG="Nozzle temperature offset calibration skipped, beacon_contact_start_print_true_zero is disabled."
    {% elif high > max_temp %}
        { action_raise_error("contact_max_hotend_temperature in [beacon] is %d, but the calibration needs %d. Raise it or lower beacon_contact_expansion_cal_temp_high." % (max_temp, high)) }
    {% else %}
        # home and level if needed
        _BEACON_HOME_AND_ABL

        _BEACON_HOOK_LED_START
        _BEACON_ECHO TITLE="BEACON" MSG="Nozzle temperature offset calibration..."

        # settle the mechanics down
        {% for i in range(10) %}
            BEACON_POKE SPEED=3 TOP=5 BOTTOM={poke_bottom}
        {% endfor %}

        # two low and high cycles, the second cycle gives the stored result
        _BEACON_PROBE_NOZZLE_TEMP_OFFSET TEMP={low}
        _BEACON_STORE_NOZZLE_TEMP_OFFSET PHASE=low
        _BEACON_PROBE_NOZZLE_TEMP_OFFSET TEMP={high}
        _BEACON_STORE_NOZZLE_TEMP_OFFSET PHASE=high
        _BEACON_PROBE_NOZZLE_TEMP_OFFSET TEMP={low}
        _BEACON_STORE_NOZZLE_TEMP_OFFSET PHASE=low
        _BEACON_PROBE_NOZZLE_TEMP_OFFSET TEMP={high}
        _BEACON_STORE_NOZZLE_TEMP_OFFSET PHASE=high

        # back to the safe home position, heater off
        _BEACON_MOVE_TO_SAFE_Z_HOME Z_HOP=1
        SET_HEATER_TEMPERATURE HEATER={s.extruder} TARGET=0

        {% if not automated %}
            _BEACON_ECHO_NOZZLE_TEMP_OFFSETS
            _BEACON_HOOK_LED_END
        {% endif %}
    {% endif %}

[gcode_macro _BEACON_PROBE_NOZZLE_TEMP_OFFSET]
gcode:
    {% set s = printer["gcode_macro _BEACON_SETTINGS"] %}
    {% set temp = params.TEMP|int %}
    {% set z_speed = s.macro_z_speed|float * 60 %}
    {% set hotend_heat_soak_time = s.hotend_heat_soak_time|int %}

    # wait for the nozzle to reach the probing temperature
    _BEACON_ECHO TITLE="BEACON" MSG="Waiting for nozzle to reach {temp}°C..."
    SET_HEATER_TEMPERATURE HEATER={s.extruder} TARGET={temp}
    TEMPERATURE_WAIT SENSOR={s.extruder} MINIMUM={temp} MAXIMUM={temp + 2}

    # wait for the extruder thermal expansion
    {% if hotend_heat_soak_time > 0 %}
        _BEACON_ECHO MSG="Heat soaking hotend for {hotend_heat_soak_time} seconds..."
        G4 P{hotend_heat_soak_time * 1000}
    {% endif %}

    # probe
    _BEACON_ECHO TITLE="BEACON" MSG="Probing with nozzle temperature {temp}°C..."
    PROBE PROBE_METHOD=contact PROBE_SPEED=3 LIFT_SPEED=15 SAMPLES=5 SAMPLE_RETRACT_DIST=3 SAMPLES_TOLERANCE=0.005 SAMPLES_TOLERANCE_RETRIES=10 SAMPLES_RESULT=median
    BEACON_QUERY

    # raise z
    G0 Z5 F{z_speed}

[gcode_macro _BEACON_STORE_NOZZLE_TEMP_OFFSET]
gcode:
    {% set s = printer["gcode_macro _BEACON_SETTINGS"] %}
    {% set phase = params.PHASE|default('low')|lower %}
    {% set low = s.beacon_contact_expansion_cal_temp_low|float %}
    {% set high = s.beacon_contact_expansion_cal_temp_high|float %}
    {% set last_z = printer.beacon.last_z_result|default(0)|float %}

    {% if phase == 'low' %}
        SET_GCODE_VARIABLE MACRO=BEACON_CALIBRATE_NOZZLE_TEMP_OFFSET VARIABLE=reference_z VALUE={last_z}
    {% else %}
        {% set reference_z = printer["gcode_macro BEACON_CALIBRATE_NOZZLE_TEMP_OFFSET"].reference_z|float %}
        # stored as mm per 100 degrees, which is what the compensation macro expects
        SAVE_VARIABLE VARIABLE=nozzle_expansion_coefficient_t0 VALUE={(last_z - reference_z) * 100 / (high - low)}
    {% endif %}

[gcode_macro _BEACON_ECHO_NOZZLE_TEMP_OFFSETS]
gcode:
    {% set svv = printer.save_variables.variables %}
    _BEACON_ECHO TYPE=info MSG="Expansion coefficient {'%.6f' % (svv.nozzle_expansion_coefficient_t0|default(0)|float)} mm per 100°C"

# ---------------------------------------------------------------------------
# Beacon offset measurement
#
# Compares the proximity (scan) reading with the contact reading at the bed center
# and at eight points around it. Large differences point to mechanical problems
# such as gantry twist or a loose Beacon mount.
# ---------------------------------------------------------------------------
[gcode_macro BEACON_MEASURE_BEACON_OFFSET]
description: Measure the difference between scan and contact readings at nine bed locations
variable_needs_compensation: False
variable_reference_z: 0.0
variable_front: 0.0
variable_front_left: 0.0
variable_front_right: 0.0
variable_back: 0.0
variable_back_left: 0.0
variable_back_right: 0.0
variable_right: 0.0
variable_left: 0.0
gcode:
    {% set s = printer["gcode_macro _BEACON_SETTINGS"] %}
    {% set tp = printer.toolhead %}
    {% set speed = s.macro_travel_speed|float * 60 %}
    {% set poke_bottom = s.beacon_contact_poke_bottom_limit|float %}
    {% set true_zero = s.beacon_contact_start_print_true_zero|string|lower == 'true' %}
    {% set mx = s.beacon_offset_measure_margin_x|float %}
    {% set my = s.beacon_offset_measure_margin_y|float %}

    # measurement positions, the center is the safe home position
    {% set x_min = tp.axis_minimum.x + mx %}
    {% set x_max = tp.axis_maximum.x - mx %}
    {% set y_min = tp.axis_minimum.y + my %}
    {% set y_max = tp.axis_maximum.y - my %}
    {% if s.safe_home_x|string|lower == 'middle' %}
        {% set x_mid = (tp.axis_minimum.x + tp.axis_maximum.x) / 2 %}
    {% else %}
        {% set x_mid = s.safe_home_x|float %}
    {% endif %}
    {% if s.safe_home_y|string|lower == 'middle' %}
        {% set y_mid = (tp.axis_minimum.y + tp.axis_maximum.y) / 2 %}
    {% else %}
        {% set y_mid = s.safe_home_y|float %}
    {% endif %}

    {% if not true_zero %}
        _BEACON_ECHO TYPE=warning MSG="Beacon offset measurement skipped, beacon_contact_start_print_true_zero is disabled."
    {% else %}
        SET_GCODE_VARIABLE MACRO=BEACON_MEASURE_BEACON_OFFSET VARIABLE=needs_compensation VALUE=False

        # home and level if needed
        _BEACON_HOME_AND_ABL

        _BEACON_HOOK_LED_START
        _BEACON_ECHO TITLE="BEACON" MSG="Measure beacon offset..."

        # settle the mechanics down
        {% for i in range(10) %}
            BEACON_POKE SPEED=3 TOP=5 BOTTOM={poke_bottom}
        {% endfor %}

        # reference location
        _BEACON_OFFSET_COMPARE
        _BEACON_STORE_BEACON_OFFSET LOCATION="center"

        G0 X{x_min} Y{y_min} F{speed}
        _BEACON_OFFSET_COMPARE
        _BEACON_STORE_BEACON_OFFSET LOCATION="front_left"

        G0 X{x_mid} Y{y_min} F{speed}
        _BEACON_OFFSET_COMPARE
        _BEACON_STORE_BEACON_OFFSET LOCATION="front"

        G0 X{x_max} Y{y_min} F{speed}
        _BEACON_OFFSET_COMPARE
        _BEACON_STORE_BEACON_OFFSET LOCATION="front_right"

        G0 X{x_max} Y{y_mid} F{speed}
        _BEACON_OFFSET_COMPARE
        _BEACON_STORE_BEACON_OFFSET LOCATION="right"

        G0 X{x_max} Y{y_max} F{speed}
        _BEACON_OFFSET_COMPARE
        _BEACON_STORE_BEACON_OFFSET LOCATION="back_right"

        G0 X{x_mid} Y{y_max} F{speed}
        _BEACON_OFFSET_COMPARE
        _BEACON_STORE_BEACON_OFFSET LOCATION="back"

        G0 X{x_min} Y{y_max} F{speed}
        _BEACON_OFFSET_COMPARE
        _BEACON_STORE_BEACON_OFFSET LOCATION="back_left"

        G0 X{x_min} Y{y_mid} F{speed}
        _BEACON_OFFSET_COMPARE
        _BEACON_STORE_BEACON_OFFSET LOCATION="left"

        # back to the safe home position
        _BEACON_MOVE_TO_SAFE_Z_HOME Z_HOP=1

        _BEACON_ECHO_BEACON_OFFSET
        _BEACON_HOOK_LED_END
    {% endif %}

[gcode_macro _BEACON_OFFSET_COMPARE]
gcode:
    _BEACON_ECHO TITLE="BEACON" MSG="Probing..."
    BEACON_OFFSET_COMPARE SAMPLES_DROP=1 SAMPLES=3
    BEACON_QUERY

[gcode_macro _BEACON_STORE_BEACON_OFFSET]
gcode:
    {% set location = params.LOCATION|lower %}
    {% set last_z = printer.beacon.last_offset_result["delta"]|default(0)|float %}
    {% if location == "center" %}
        SET_GCODE_VARIABLE MACRO=BEACON_MEASURE_BEACON_OFFSET VARIABLE=reference_z VALUE={last_z}
    {% else %}
        {% set reference_z = printer["gcode_macro BEACON_MEASURE_BEACON_OFFSET"].reference_z|float %}
        SET_GCODE_VARIABLE MACRO=BEACON_MEASURE_BEACON_OFFSET VARIABLE={location} VALUE={last_z - reference_z}
    {% endif %}

[gcode_macro _BEACON_ECHO_BEACON_OFFSET]
gcode:
    {% set m = printer["gcode_macro BEACON_MEASURE_BEACON_OFFSET"] %}
    {% set front_left = m.front_left|float * 1000 %}
    {% set front = m.front|float * 1000 %}
    {% set front_right = m.front_right|float * 1000 %}
    {% set right = m.right|float * 1000 %}
    {% set back_right = m.back_right|float * 1000 %}
    {% set back = m.back|float * 1000 %}
    {% set back_left = m.back_left|float * 1000 %}
    {% set left = m.left|float * 1000 %}

    {% set line_1 = "Front left:    %.6fμm" % front_left %}
    {% set line_2 = "Front center:  %.6fμm" % front %}
    {% set line_3 = "Front right:   %.6fμm" % front_right %}
    {% set line_4 = "Left center:   %.6fμm" % left %}
    {% set line_5 = "Right center:  %.6fμm" % right %}
    {% set line_6 = "Back left:     %.6fμm" % back_left %}
    {% set line_7 = "Back center:   %.6fμm" % back %}
    {% set line_8 = "Back right:    %.6fμm" % back_right %}

    {% set max_value = [front_left|abs, front|abs, front_right|abs, left|abs, right|abs, back_left|abs, back|abs, back_right|abs]|max %}
    {% if max_value <= 50 %}
        {% set type = "success" %}
        {% set recommendation = "Very low beacon offset: %.6fμm._N_Scan readings agree well with contact." % max_value %}
    {% elif max_value <= 100 %}
        {% set type = "info" %}
        {% set recommendation = "Low beacon offset: %.6fμm._N_You may see first layer inconsistencies, consider a contact bed mesh." % max_value %}
        SET_GCODE_VARIABLE MACRO=BEACON_MEASURE_BEACON_OFFSET VARIABLE=needs_compensation VALUE=True
    {% elif max_value <= 150 %}
        {% set type = "warning" %}
        {% set recommendation = "High beacon offset: %.6fμm._N_High chance of first layer problems, a contact bed mesh is highly encouraged." % max_value %}
        SET_GCODE_VARIABLE MACRO=BEACON_MEASURE_BEACON_OFFSET VARIABLE=needs_compensation VALUE=True
    {% elif max_value <= 200 %}
        {% set type = "alert" %}
        {% set recommendation = "Very high beacon offset: %.6fμm._N_You will see first layer problems on large prints unless you use a contact bed mesh." % max_value %}
        SET_GCODE_VARIABLE MACRO=BEACON_MEASURE_BEACON_OFFSET VARIABLE=needs_compensation VALUE=True
    {% else %}
        {% set type = "alert" %}
        {% set recommendation = "Extremely high beacon offset: %.6fμm._N_Scan and contact disagree strongly, which points to a mechanical problem. Investigate before using software compensation." % max_value %}
        SET_GCODE_VARIABLE MACRO=BEACON_MEASURE_BEACON_OFFSET VARIABLE=needs_compensation VALUE=True
    {% endif %}

    _BEACON_ECHO TITLE="Beacon offset relative to the center" TYPE={type} MSG="{recommendation}_N__N_{line_1}_N_{line_2}_N_{line_3}_N_{line_4}_N_{line_5}_N_{line_6}_N_{line_7}_N_{line_8}"
