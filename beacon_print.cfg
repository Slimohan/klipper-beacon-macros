# beacon_print.cfg
#
# RatOS style START_PRINT and END_PRINT for the Beacon macro set, for stock
# Klipper and Kalico. Include it AFTER beacon_macros.cfg (and after
# beacon_extras.cfg if you use the extras):
#
#   [include beacon_macros/beacon_macros.cfg]
#   [include beacon_macros/beacon_extras.cfg]
#   [include beacon_macros/beacon_print.cfg]
#
# Optional: [include beacon_macros/beacon_cancel_print.cfg] for CANCEL_PRINT.
#
# This follows the order of START_PRINT in RatOS, step by step, and uses the
# same slicer parameters, the same hook macro names (_USER_START_PRINT_*,
# _START_PRINT_*, _USER_END_PRINT_*, _END_PRINT_*) and the same setting names,
# so the slicer start gcode and your hook macros of a RatOS printer work here
# unchanged. What differs from RatOS is listed in README.md ("Print start and
# end"). In short: no IDEX, no VAOC, no stowable probe, no chamber filter,
# no RatOS skew profile.
#
# Slicer start gcode (same as for RatOS):
#
#   START_PRINT EXTRUDER_TEMP=[first_layer_temperature] EXTRUDER_OTHER_LAYER_TEMP=[temperature] BED_TEMP=[first_layer_bed_temperature] X0=[first_layer_print_min_0] Y0=[first_layer_print_min_1] X1=[first_layer_print_max_0] Y1=[first_layer_print_max_1] TOTAL_LAYER_COUNT=[total_layer_count]
#
# Optional parameters: FIRST_X FIRST_Y CHAMBER_TEMP START_CHAMBER_TEMP INITIAL_TOOL
#
# Rules for this file: Klipper strips everything after a hash sign, so macro
# comments are whole lines. The macros render all their text before the first
# command runs, so anything that depends on the state the commands create
# lives in its own sub macro.
#
# Based on the macros of RatOS (GPL-3.0). See README.md.

# ---------------------------------------------------------------------------
# State kept between macro runs. Do not edit.
# ---------------------------------------------------------------------------
[gcode_macro _BEACON_PRINT_STATE]
description: Internal state of the print start macros
variable_probe_for_priming_result: None
variable_probe_for_priming_end_result: None
variable_toolhead_cache: {}
gcode:
    {% set unused = 0 %}

# ---------------------------------------------------------------------------
# Hooks for LEDs. They do nothing by default, redefine them in printer.cfg.
# ---------------------------------------------------------------------------
[gcode_macro _BEACON_HOOK_LED_START_PRINTING]
description: Called when START_PRINT begins
gcode:
    {% set unused = 0 %}

[gcode_macro _BEACON_HOOK_LED_PRINTING]
description: Called when the print is about to start
gcode:
    {% set unused = 0 %}

[gcode_macro _BEACON_HOOK_LED_START_PRINTING_ERROR]
description: Called when START_PRINT stops with an error
gcode:
    {% set unused = 0 %}

# ---------------------------------------------------------------------------
# Helpers
# ---------------------------------------------------------------------------
[gcode_macro _BEACON_RAISE]
description: Raise a G-code error with MSG=text. Used so a hook can run before the error.
gcode:
    { action_raise_error(params.MSG|default("error")) }

[gcode_macro _BEACON_CACHE_TOOLHEAD_SETTINGS]
description: Remember velocity, acceleration and cornering settings under KEY=name
gcode:
    {% set key = params.KEY|default("global") %}
    {% set cache = printer["gcode_macro _BEACON_PRINT_STATE"].toolhead_cache %}
    {% set tp = printer.toolhead %}
    {% set unused = cache.__setitem__(key, {"accel": tp.max_accel, "ratio": tp.minimum_cruise_ratio|default(none), "speed": tp.max_velocity, "scv": tp.square_corner_velocity}) %}
    SET_GCODE_VARIABLE MACRO=_BEACON_PRINT_STATE VARIABLE=toolhead_cache VALUE="{cache | pprint | replace("\n", "") | replace("\"", "\\\"")}"
    _BEACON_DEBUG MSG="Toolhead settings cached for {key}"

[gcode_macro _BEACON_RESTORE_TOOLHEAD_SETTINGS]
description: Restore the settings remembered under KEY=name
gcode:
    {% set key = params.KEY|default("global") %}
    {% set cache = printer["gcode_macro _BEACON_PRINT_STATE"].toolhead_cache %}
    {% if key in cache %}
        {% set v = cache[key] %}
        {% if v.ratio is none %}
            SET_VELOCITY_LIMIT ACCEL={v.accel} VELOCITY={v.speed} SQUARE_CORNER_VELOCITY={v.scv}
        {% else %}
            SET_VELOCITY_LIMIT ACCEL={v.accel} MINIMUM_CRUISE_RATIO={v.ratio} VELOCITY={v.speed} SQUARE_CORNER_VELOCITY={v.scv}
        {% endif %}
        _BEACON_DEBUG MSG="Toolhead settings restored for {key}"
    {% else %}
        _BEACON_ECHO TYPE=warning MSG="No toolhead settings cached for {key}, nothing restored."
    {% endif %}

[gcode_macro _BEACON_SET_MACRO_TRAVEL_SETTINGS]
description: Velocity and acceleration for the moves of the print start macros
gcode:
    {% set s = printer["gcode_macro _BEACON_SETTINGS"] %}
    {% if printer.toolhead.minimum_cruise_ratio is defined %}
        SET_VELOCITY_LIMIT ACCEL={s.macro_travel_accel|float} MINIMUM_CRUISE_RATIO=0.5 VELOCITY={s.macro_travel_speed|float} SQUARE_CORNER_VELOCITY=5
    {% else %}
        SET_VELOCITY_LIMIT ACCEL={s.macro_travel_accel|float} VELOCITY={s.macro_travel_speed|float} SQUARE_CORNER_VELOCITY=5
    {% endif %}

# ---------------------------------------------------------------------------
# User hooks. Same names as RatOS. They do nothing by default. Redefine the
# ones you need in printer.cfg after the include.
# ---------------------------------------------------------------------------
[gcode_macro _USER_START_PRINT]
gcode:
    {% set unused = 0 %}

[gcode_macro _USER_START_PRINT_BEFORE_HOMING]
gcode:
    {% set unused = 0 %}

[gcode_macro _USER_START_PRINT_HEAT_CHAMBER]
gcode:
    {% set unused = 0 %}

[gcode_macro _USER_START_PRINT_AFTER_HEATING_BED]
gcode:
    {% set unused = 0 %}

[gcode_macro _USER_START_PRINT_BED_MESH]
gcode:
    {% set unused = 0 %}

[gcode_macro _USER_START_PRINT_PARK]
gcode:
    {% set unused = 0 %}

[gcode_macro _USER_START_PRINT_AFTER_HEATING_EXTRUDER]
gcode:
    {% set unused = 0 %}

[gcode_macro _USER_END_START_PRINT]
gcode:
    {% set unused = 0 %}

[gcode_macro _USER_END_PRINT_BEFORE_HEATERS_OFF]
gcode:
    {% set unused = 0 %}

[gcode_macro _USER_END_PRINT_AFTER_HEATERS_OFF]
gcode:
    {% set unused = 0 %}

[gcode_macro _USER_END_PRINT_PARK]
gcode:
    {% set unused = 0 %}

[gcode_macro _USER_END_PRINT_FINISHED]
gcode:
    {% set unused = 0 %}

# ---------------------------------------------------------------------------
# START_PRINT
# ---------------------------------------------------------------------------
[gcode_macro START_PRINT]
description: Start print procedure, use this in your slicer. Same parameters as START_PRINT of RatOS.
variable_is_printing_gcode: False        # internal use only. Do not touch!
variable_initial_tool: 0                 # internal use only. Do not touch!
variable_first_x: -1                     # internal use only. Do not touch!
variable_first_y: -1                     # internal use only. Do not touch!
variable_extruder_first_layer_temp: ""   # internal use only. Do not touch!
variable_extruder_other_layer_temp: ""   # internal use only. Do not touch!
gcode:
    {% set s = printer["gcode_macro _BEACON_SETTINGS"] %}

    # mandatory parameter sanity check
    {% if params.EXTRUDER_TEMP is not defined %}
        _BEACON_HOOK_LED_START_PRINTING_ERROR
        _BEACON_RAISE MSG="Missing START_PRINT parameter. EXTRUDER_TEMP parameter not found."
    {% endif %}
    {% if params.EXTRUDER_OTHER_LAYER_TEMP is not defined %}
        _BEACON_HOOK_LED_START_PRINTING_ERROR
        _BEACON_RAISE MSG="Missing START_PRINT parameter. EXTRUDER_OTHER_LAYER_TEMP parameter not found."
    {% endif %}
    {% if params.BED_TEMP is not defined %}
        _BEACON_HOOK_LED_START_PRINTING_ERROR
        _BEACON_RAISE MSG="Missing START_PRINT parameter. BED_TEMP parameter not found."
    {% endif %}
    {% if printer.beacon is not defined %}
        _BEACON_HOOK_LED_START_PRINTING_ERROR
        _BEACON_RAISE MSG="START_PRINT: the Beacon is not configured. This START_PRINT is made for a Beacon."
    {% endif %}

    # visual feedback
    _BEACON_HOOK_LED_START_PRINTING

    # cache toolhead settings
    _BEACON_CACHE_TOOLHEAD_SETTINGS KEY="start_print"

    # user START_PRINT hook
    _USER_START_PRINT {rawparams}

    # settings
    {% set hotend_heat_soak_time = s.hotend_heat_soak_time|float %}
    {% set heater = s.extruder %}

    # macro parameters
    {% set X0 = params.X0|default(-1)|float %}
    {% set X1 = params.X1|default(-1)|float %}
    {% set Y0 = params.Y0|default(-1)|float %}
    {% set Y1 = params.Y1|default(-1)|float %}
    {% set first_x = params.FIRST_X|default(-1)|float %}
    {% set first_y = params.FIRST_Y|default(-1)|float %}
    {% set initial_tool = params.INITIAL_TOOL|default(0)|int %}
    {% set start_chamber_temp = params.START_CHAMBER_TEMP|default(0)|int %}
    {% set chamber_temp = params.CHAMBER_TEMP|default(0)|int %}
    {% set bed_temp = params.BED_TEMP|default(printer.heater_bed.target, true)|float %}
    {% set total_layer_count = params.TOTAL_LAYER_COUNT|default(0)|int %}
    {% set temps = (params.EXTRUDER_TEMP|default("0")|string|replace(" ", "")).split(",") %}
    {% set first_layer_temp = (temps[initial_tool] if initial_tool < temps|length else temps[0])|float %}

    # an active Beacon model is needed unless the true zero creates one
    _BEACON_START_PRINT_CHECK_MODEL

    # reset state of the previous print, error early when scan compensation is set up but its mesh is missing
    SET_GCODE_VARIABLE MACRO=_BEACON_STATE VARIABLE=true_zero_x VALUE=-1
    SET_GCODE_VARIABLE MACRO=_BEACON_STATE VARIABLE=true_zero_y VALUE=-1
    {% if printer["gcode_macro BEACON_PREFLIGHT_SCAN_COMPENSATION"] is defined %}
        BEACON_PREFLIGHT_SCAN_COMPENSATION BED_TEMP={bed_temp}
    {% endif %}

    _BEACON_ECHO MSG="First print coordinates X:{first_x} Y:{first_y}"

    # the slicer start gcode must pass TOTAL_LAYER_COUNT
    {% if params.TOTAL_LAYER_COUNT is not defined %}
        _BEACON_ECHO TYPE=warning TITLE="Incomplete Slicer Configuration detected" MSG="Your slicer start gcode does not pass TOTAL_LAYER_COUNT. See the README of the Beacon macros."
    {% endif %}

    # update printer stats
    SET_PRINT_STATS_INFO CURRENT_LAYER=1
    {% if total_layer_count > 0 %}
        SET_PRINT_STATS_INFO TOTAL_LAYER={total_layer_count}
    {% endif %}

    # reset is_printing_gcode state and cache the print variables
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=is_printing_gcode VALUE=False
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=initial_tool VALUE={initial_tool}
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=first_x VALUE={first_x}
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=first_y VALUE={first_y}
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=extruder_first_layer_temp VALUE="'{params.EXTRUDER_TEMP}'"
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=extruder_other_layer_temp VALUE="'{params.EXTRUDER_OTHER_LAYER_TEMP}'"

    # filament detection in case filament sensors are configured
    _BEACON_START_PRINT_CHECK_FILAMENT

    # start
    {% if printer.pause_resume is defined %}
        CLEAR_PAUSE
    {% endif %}
    {% if s.force_absolute_position|string|lower == 'true' %}
        G90
    {% endif %}
    SAVE_GCODE_STATE NAME=start_print_state

    # metric values, absolute positioning, absolute extrusion
    G21
    G90
    M82
    _USER_START_PRINT_BEFORE_HOMING {rawparams}

    # home if needed, and make sure we are clear of the bed
    _BEACON_MAYBE_HOME
    _BEACON_Z_HOP

    # heat chamber
    {% if chamber_temp > 0 %}
        _BEACON_HOOK_CHAMBER_ON START_CHAMBER_TEMP={start_chamber_temp} CHAMBER_TEMP={chamber_temp}
        _USER_START_PRINT_HEAT_CHAMBER {rawparams} CHAMBER_TEMP={chamber_temp}
    {% endif %}

    # run the customizable BEFORE_HEATING_BED macro
    _START_PRINT_BEFORE_HEATING_BED

    _BEACON_ECHO MSG="Heating bed..."
    M190 S{bed_temp}

    # wait for bed thermal expansion
    _BEACON_START_PRINT_HEAT_SOAK

    # run the user created AFTER_HEATING_BED macro
    _USER_START_PRINT_AFTER_HEATING_BED {rawparams}

    # run the customizable AFTER_HEATING_BED macro
    _START_PRINT_AFTER_HEATING_BED

    # run the user created START_PRINT_BED_MESH macro
    _USER_START_PRINT_BED_MESH {rawparams} X0={X0} X1={X1} Y0={Y0} Y1={Y1}

    # run the customizable BED_MESH macro
    _START_PRINT_BED_MESH X0={X0} X1={X1} Y0={Y0} Y1={Y1}

    # start heating the extruder
    SET_HEATER_TEMPERATURE HEATER="{heater}" TARGET={first_layer_temp}

    # run the users PARK macro
    _USER_START_PRINT_PARK {rawparams}

    # run the customizable PARK macro
    _START_PRINT_PARK

    # wait for the extruder to heat up
    _BEACON_ECHO MSG="Heating Extruder..."
    TEMPERATURE_WAIT SENSOR="{heater}" MINIMUM={first_layer_temp} MAXIMUM={first_layer_temp + 5}

    # wait for extruder thermal expansion
    {% if hotend_heat_soak_time > 0 %}
        _BEACON_ECHO MSG="Heat soaking hotend for {hotend_heat_soak_time|round(0)|int} seconds..."
        G4 P{hotend_heat_soak_time * 1000}
    {% endif %}

    # visual feedback
    _BEACON_HOOK_LED_PRINTING

    # run the user created AFTER_HEATING_EXTRUDER macro
    _USER_START_PRINT_AFTER_HEATING_EXTRUDER {rawparams} X0={X0} X1={X1} Y0={Y0} Y1={Y1}

    # run the customizable AFTER_HEATING_EXTRUDER macro
    _START_PRINT_AFTER_HEATING_EXTRUDER X0={X0} X1={X1} Y0={Y0} Y1={Y1}

    # restore gcode state
    RESTORE_GCODE_STATE NAME=start_print_state

    # set the nozzle thermal expansion offset for the print temperature
    _BEACON_UPDATE_NOZZLE_TEMP_OFFSET

    # set the extrusion mode based on the settings
    _BEACON_SET_EXTRUSION_MODE

    # set is_printing_gcode state
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=is_printing_gcode VALUE=True

    # user END_START_PRINT hook
    _USER_END_START_PRINT {rawparams}

    # reset extrusion distance
    G92 E0

    _BEACON_ALERT_NON_ZERO_Z_OFFSET

    _BEACON_ECHO MSG="Printing..."

# ---------------------------------------------------------------------------
# START_PRINT parts
# ---------------------------------------------------------------------------
[gcode_macro _BEACON_START_PRINT_CHECK_MODEL]
description: Stop early when a Beacon model is needed but not active
gcode:
    {% set s = printer["gcode_macro _BEACON_SETTINGS"] %}
    {% set true_zero = s.beacon_contact_start_print_true_zero|string|lower == 'true' %}
    {% set calibrate_model = s.beacon_contact_calibrate_model_on_true_zero|string|lower == 'true' %}
    {% set cfg = printer.configfile.settings %}
    {% if printer.beacon.model is none %}
        {% set need_for_zero = true_zero and not calibrate_model %}
        {% set home_method = cfg.beacon.home_method|default('proximity')|string|lower %}
        {% set need_for_homing = cfg.stepper_z.endstop_pin|string == 'probe:z_virtual_endstop' and home_method == 'proximity' and s.beacon_contact_z_homing|string|lower != 'true' %}
        {% if need_for_zero or need_for_homing %}
            _BEACON_HOOK_LED_START_PRINTING_ERROR
            _BEACON_RAISE MSG="An active Beacon model is required. Have you performed the initial Beacon calibration (BEACON_FULL_CALIBRATE)?"
        {% endif %}
    {% endif %}

[gcode_macro _BEACON_START_PRINT_CHECK_FILAMENT]
description: Stop when a configured filament sensor reports no filament
gcode:
    {% set s = printer["gcode_macro _BEACON_SETTINGS"] %}
    {% set names = (s.filament_sensors|string|replace(" ", "")).split(",") %}
    {% set ns = namespace(empty="") %}
    {% for name in names %}
        {% if name != "" and printer["filament_switch_sensor " ~ name] is defined %}
            {% set sensor = printer["filament_switch_sensor " ~ name] %}
            {% if sensor.enabled|string|lower == "true" and sensor.filament_detected|string|lower != "true" and ns.empty == "" %}
                {% set ns.empty = name %}
            {% endif %}
        {% endif %}
    {% endfor %}
    {% if ns.empty != "" %}
        _BEACON_HOOK_LED_START_PRINTING_ERROR
        _BEACON_RAISE MSG="Filament not detected! Filament sensor {ns.empty} is empty."
    {% endif %}

[gcode_macro _BEACON_START_PRINT_HEAT_SOAK]
description: Wait for the bed to expand. Adaptive (Beacon) when enabled, otherwise the fixed bed_heat_soak_time
gcode:
    {% set s = printer["gcode_macro _BEACON_SETTINGS"] %}
    {% if printer["gcode_macro BEACON_HEAT_SOAK"] is defined %}
        BEACON_HEAT_SOAK
    {% elif s.bed_heat_soak_time|float > 0 %}
        _BEACON_ECHO MSG="Heat soaking bed for {s.bed_heat_soak_time|float|round(0)|int} seconds..."
        G4 P{s.bed_heat_soak_time|float * 1000}
    {% endif %}

[gcode_macro _START_PRINT_BEFORE_HEATING_BED]
description: Preheat the nozzle and park the Beacon in the middle at Z2 for heat soaking
gcode:
    {% set s = printer["gcode_macro _BEACON_SETTINGS"] %}
    {% set min_temp = s.preheat_extruder_temp|float %}
    {% set z_speed = s.macro_z_speed|float * 60 %}

    # preheat extruder
    {% if s.preheat_extruder|string|lower == 'true' %}
        _BEACON_ECHO MSG="Pre-heating extruder..."
        # The nozzle reaches a predefined preheat temperature so the Beacon is at a predictable
        # temperature. It also lets the bed heat spread and softens plastic stuck to the nozzle.
        SET_HEATER_TEMPERATURE HEATER="{s.extruder}" TARGET={min_temp}
    {% endif %}

    # park the toolhead in the center at Z=2 for heat soaking
    _BEACON_ECHO MSG="Heat soaking z probe..."
    _BEACON_MOVE_TO_SAFE_Z_HOME
    # always soak close to first layer height
    G0 Z2 F{z_speed}

[gcode_macro _START_PRINT_AFTER_HEATING_BED]
description: Wait for the preheat, level the bed, set the true zero
gcode:
    {% set s = printer["gcode_macro _BEACON_SETTINGS"] %}
    {% set min_temp = s.preheat_extruder_temp|float %}
    {% set max_temp = min_temp + 5 %}
    {% set true_zero = s.beacon_contact_start_print_true_zero|string|lower == 'true' %}

    # wait for the extruder to be preheated
    {% if s.preheat_extruder|string|lower == 'true' %}
        _BEACON_ECHO MSG="Waiting for extruder to be preheated..."
        TEMPERATURE_WAIT SENSOR={s.extruder} MINIMUM={min_temp} MAXIMUM={max_temp}
    {% endif %}

    # raise Z after heat soaking the Beacon
    _BEACON_Z_HOP

    # automatic bed leveling
    {% set ns = namespace(needs_rehoming=False) %}
    {% if printer.z_tilt is defined and not printer.z_tilt.applied %}
        _BEACON_ECHO MSG="Adjusting Z tilt..."
        Z_TILT_ADJUST
        _BEACON_ECHO MSG="Rehoming Z after Z tilt adjustment..."
        {% set ns.needs_rehoming = True %}
    {% endif %}
    {% if printer.quad_gantry_level is defined and not printer.quad_gantry_level.applied %}
        _BEACON_ECHO MSG="Running quad gantry leveling..."
        QUAD_GANTRY_LEVEL
        _BEACON_ECHO MSG="Rehoming Z after quad gantry leveling..."
        {% set ns.needs_rehoming = True %}
    {% endif %}

    # home again, Z has changed after automatic bed leveling and bed heating
    {% if ns.needs_rehoming %}
        G28 Z
    {% endif %}

    # Beacon contact true zero, with the optional nozzle clean. The hotend soak is done later, as in RatOS.
    {% if true_zero %}
        BEACON_TRUE_ZERO HOTEND_SOAK=0
    {% endif %}

# ---------------------------------------------------------------------------
# Bed mesh
# ---------------------------------------------------------------------------
[gcode_macro _BEACON_MESH_CALIBRATE]
description: BED_MESH_CALIBRATE with the Beacon method from the settings. PROFILE= and optional ALGORITHM= MESH_MIN= MESH_MAX= PROBE_COUNT=
gcode:
    {% set s = printer["gcode_macro _BEACON_SETTINGS"] %}
    {% set contact = s.beacon_contact_bed_mesh|string|lower == 'true' %}
    {% set automatic = s.beacon_scan_method_automatic|string|lower == 'true' %}
    {% set extra = "" %}
    {% if params.ALGORITHM is defined %}{% set extra = extra ~ " ALGORITHM=" ~ params.ALGORITHM %}{% endif %}
    {% if params.MESH_MIN is defined %}{% set extra = extra ~ " MESH_MIN=" ~ params.MESH_MIN %}{% endif %}
    {% if params.MESH_MAX is defined %}{% set extra = extra ~ " MESH_MAX=" ~ params.MESH_MAX %}{% endif %}
    {% if params.PROBE_COUNT is defined %}{% set extra = extra ~ " PROBE_COUNT=" ~ params.PROBE_COUNT %}{% endif %}
    {% if contact %}
        {% if params.MESH_MIN is defined %}
            BED_MESH_CALIBRATE PROBE_METHOD=contact USE_CONTACT_AREA=1 SAMPLES={s.beacon_contact_bed_mesh_samples|int} PROFILE="{params.PROFILE}"{extra} RELATIVE_REFERENCE_INDEX=-1
        {% else %}
            BED_MESH_CALIBRATE PROBE_METHOD=contact USE_CONTACT_AREA=1 SAMPLES={s.beacon_contact_bed_mesh_samples|int} PROFILE="{params.PROFILE}"
        {% endif %}
    {% else %}
        {% if automatic %}
            BED_MESH_CALIBRATE METHOD=automatic PROFILE="{params.PROFILE}"{extra}
        {% else %}
            BED_MESH_CALIBRATE PROFILE="{params.PROFILE}"{extra}
        {% endif %}
        {% if printer["gcode_macro BEACON_APPLY_SCAN_COMPENSATION_IF_ENABLED"] is defined %}
            BEACON_APPLY_SCAN_COMPENSATION_IF_ENABLED
        {% endif %}
    {% endif %}

[gcode_macro _START_PRINT_BED_MESH]
description: Calibrate the bed mesh (adaptive when possible) and set its zero reference to the true zero position
gcode:
    # handle toolhead settings
    _BEACON_CACHE_TOOLHEAD_SETTINGS KEY="start_print_bed_mesh"
    _BEACON_SET_MACRO_TRAVEL_SETTINGS

    {% set s = printer["gcode_macro _BEACON_SETTINGS"] %}
    {% set tp = printer.toolhead %}
    {% set state = printer["gcode_macro _BEACON_STATE"] %}
    {% set cfg = printer.configfile.settings %}

    # parameters
    {% set X0 = params.X0|default(-1)|float %}
    {% set X1 = params.X1|default(-1)|float %}
    {% set Y0 = params.Y0|default(-1)|float %}
    {% set Y1 = params.Y1|default(-1)|float %}
    _BEACON_DEBUG MSG="_START_PRINT_BED_MESH X0={X0} X1={X1} Y0={Y0} Y1={Y1}"

    # zero reference position: the configured one, else where the true zero was measured, else the safe home position
    {% set zero_ref = none %}
    {% if cfg.bed_mesh is defined and cfg.bed_mesh.zero_reference_position is defined and cfg.bed_mesh.zero_reference_position is not none %}
        {% set zero_ref = cfg.bed_mesh.zero_reference_position %}
    {% endif %}
    {% if zero_ref is none %}
        {% if state.true_zero_x|float > -1 and state.true_zero_y|float > -1 %}
            {% set zero_x = state.true_zero_x|float %}
            {% set zero_y = state.true_zero_y|float %}
        {% else %}
            {% if s.safe_home_x|string|lower == 'middle' %}
                {% set zero_x = (tp.axis_minimum.x + tp.axis_maximum.x) / 2 %}
            {% else %}
                {% set zero_x = s.safe_home_x|float %}
            {% endif %}
            {% if s.safe_home_y|string|lower == 'middle' %}
                {% set zero_y = (tp.axis_minimum.y + tp.axis_maximum.y) / 2 %}
            {% else %}
                {% set zero_y = s.safe_home_y|float %}
            {% endif %}
        {% endif %}
    {% else %}
        {% set zero_x = zero_ref[0]|float %}
        {% set zero_y = zero_ref[1]|float %}
    {% endif %}

    # a defined zero reference and a fuzzy true zero do not go together
    {% if zero_ref is not none and s.beacon_contact_start_print_true_zero|string|lower == 'true' and s.beacon_contact_start_print_true_zero_fuzzy_position|string|lower == 'true' and s.beacon_contact_start_print_true_zero_fuzzy_radius|float > 0 %}
        _BEACON_ECHO TYPE=warning TITLE="Zero reference and fuzzy true zero" MSG="[bed_mesh] has a zero_reference_position and the true zero position is fuzzy. The mesh is referenced to the configured position, not to where the true zero was measured. Remove zero_reference_position from [bed_mesh] or switch the fuzzy position off."
    {% endif %}

    # proximity meshes use their own cornering velocity
    {% if s.beacon_contact_bed_mesh|string|lower != 'true' %}
        SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={s.beacon_bed_mesh_scv|int}
    {% endif %}

    # calibrate the bed mesh
    {% set default_profile = s.bed_mesh_profile|string if s.bed_mesh_profile|string != "" else "default" %}
    {% if s.calibrate_bed_mesh|string|lower == 'true' %}
        BED_MESH_CLEAR
        {% if s.adaptive_mesh|string|lower == 'true' %}
            BEACON_ADAPTIVE_MESH PROFILE="{default_profile}" X0={X0} X1={X1} Y0={Y0} Y1={Y1} ZERO_REF_POS_X={zero_x} ZERO_REF_POS_Y={zero_y}
        {% else %}
            _BEACON_MESH_CALIBRATE PROFILE="{default_profile}"
        {% endif %}
        BED_MESH_PROFILE LOAD="{default_profile}"
        _BEACON_START_PRINT_ZERO_REFERENCE X={zero_x} Y={zero_y}
    {% elif s.bed_mesh_profile|string != "" %}
        BED_MESH_CLEAR
        BED_MESH_PROFILE LOAD="{s.bed_mesh_profile}"
        _BEACON_START_PRINT_ZERO_REFERENCE X={zero_x} Y={zero_y}
    {% endif %}

    # handle toolhead settings
    _BEACON_RESTORE_TOOLHEAD_SETTINGS KEY="start_print_bed_mesh"

[gcode_macro _BEACON_START_PRINT_ZERO_REFERENCE]
description: Set the zero reference of the loaded mesh. Needs the beacon_zero_reference module, or zero_reference_position in [bed_mesh].
gcode:
    {% if printer.configfile.settings.beacon_zero_reference is defined %}
        SET_ZERO_REFERENCE_POSITION X={params.X|float} Y={params.Y|float}
    {% elif printer.configfile.settings.bed_mesh.zero_reference_position is defined and printer.configfile.settings.bed_mesh.zero_reference_position is not none %}
        _BEACON_DEBUG MSG="Zero reference position comes from [bed_mesh]"
    {% else %}
        _BEACON_ECHO TYPE=warning TITLE="No zero reference" MSG="The bed mesh is not referenced to the true zero. Add [beacon_zero_reference] (see beacon_extras.cfg) or set zero_reference_position in [bed_mesh]."
    {% endif %}

[gcode_macro BEACON_ADAPTIVE_MESH]
description: Bed mesh over the print area only. PROFILE= X0= Y0= X1= Y1= (from the slicer) ZERO_REF_POS_X= ZERO_REF_POS_Y=
gcode:
    {% set s = printer["gcode_macro _BEACON_SETTINGS"] %}
    {% set cfg = printer.configfile.config %}
    {% set contact = s.beacon_contact_bed_mesh|string|lower == 'true' %}
    {% set default_profile = params.PROFILE %}

    # coordinates from the slicer start gcode
    {% set x0 = params.X0|default(-1)|float %}
    {% set y0 = params.Y0|default(-1)|float %}
    {% set x1 = params.X1|default(-1)|float %}
    {% set y1 = params.Y1|default(-1)|float %}

    _BEACON_ECHO MSG="Adaptive Mesh: Received coordinates X0={x0|round(1)} Y0={y0|round(1)} X1={x1|round(1)} Y1={y1|round(1)}"

    {% if x0 >= x1 or y0 >= y1 %}
        # coordinates are invalid, fall back to full bed mesh
        _BEACON_ECHO MSG="Adaptive Mesh: Invalid coordinates received. Please check your slicer settings. Falling back to full bed mesh."
        _BEACON_MESH_CALIBRATE PROFILE="{default_profile}"
    {% else %}
        # zero reference position. If both values are given, the mesh region is expanded to include
        # it, so the zero reference position can be set meaningfully for the mesh.
        {% if params.ZERO_REF_POS_X is defined and params.ZERO_REF_POS_Y is defined %}
            {% set zero_x = params.ZERO_REF_POS_X|float %}
            {% set zero_y = params.ZERO_REF_POS_Y|float %}
            {% if zero_x < x0 or zero_x > x1 or zero_y < y0 or zero_y > y1 %}
                _BEACON_ECHO MSG="Adaptive Mesh: Zero reference position X={zero_x|round(1)} Y={zero_y|round(1)} is outside the mesh region, expanding mesh region to include it."
                {% set x0 = [x0, zero_x]|min %}
                {% set y0 = [y0, zero_y]|min %}
                {% set x1 = [x1, zero_x]|max %}
                {% set y1 = [y1, zero_y]|max %}
            {% endif %}
        {% endif %}

        # configured bed mesh area
        {% set mesh_config = cfg.bed_mesh %}
        {% set min_x = mesh_config.mesh_min.split(",")[0]|float %}
        {% set min_y = mesh_config.mesh_min.split(",")[1]|float %}
        {% set max_x = mesh_config.mesh_max.split(",")[0]|float %}
        {% set max_y = mesh_config.mesh_max.split(",")[1]|float %}

        # make sure the mesh coordinates lie within the configured mesh area
        {% set mesh_x0 = [[x0, max_x]|min, min_x]|max %}
        {% set mesh_y0 = [[y0, max_y]|min, min_y]|max %}
        {% set mesh_x1 = [[x1, max_x]|min, min_x]|max %}
        {% set mesh_y1 = [[y1, max_y]|min, min_y]|max %}

        {% if mesh_x0 == min_x and mesh_y0 == min_y and mesh_x1 == max_x and mesh_y1 == max_y %}
            _BEACON_ECHO MSG="Adaptive Mesh: Print is using the full bed, falling back to full bed mesh."
            _BEACON_MESH_CALIBRATE PROFILE="{default_profile}"
        {% else %}
            # configured probe count
            {% set probe_count = mesh_config.probe_count|default("3,3")|string %}
            {% set probe_count_x = probe_count.split(",")[0]|int %}
            {% if probe_count.split(",")|length == 2 %}
                {% set probe_count_y = probe_count.split(",")[1]|int %}
            {% else %}
                {% set probe_count_y = probe_count_x %}
            {% endif %}

            # mesh point resolution
            {% set probe_x_step = (max_x - min_x) / probe_count_x %}
            {% set probe_y_step = (max_y - min_y) / probe_count_y %}

            # xy probe count
            {% set mesh_count_x = ([(mesh_x1 - mesh_x0) / probe_x_step, 3]|max)|int %}
            {% set mesh_count_y = ([(mesh_y1 - mesh_y0) / probe_y_step, 3]|max)|int %}
            {% set min_mesh_count = [mesh_count_x, mesh_count_y]|min %}
            {% set max_mesh_count = [mesh_count_x, mesh_count_y]|max %}

            # check the algorithm
            {% set algorithm = mesh_config.algorithm|default("lagrange")|string %}
            {% if algorithm|lower == 'lagrange' and max_mesh_count > 6 %}
                _BEACON_ECHO MSG="Adaptive Mesh: cannot exceed a probe_count of 6 when using lagrange interpolation. Falling back to bicubic interpolation."
                {% set algorithm = 'bicubic' %}
            {% endif %}
            {% if algorithm|lower == 'bicubic' and min_mesh_count < 4 %}
                {% if max_mesh_count > 6 %}
                    _BEACON_ECHO MSG="Adaptive Mesh: invalid probe_count option when using bicubic interpolation. Combination of 3 points on one axis with more than 6 on another is not permitted. Forcing minimum mesh count to be 4."
                    {% set min_mesh_count = 4 %}
                {% else %}
                    _BEACON_ECHO MSG="Adaptive Mesh: bicubic interpolation with a probe_count of less than 4 points detected. Forcing lagrange interpolation."
                    {% set algorithm = 'lagrange' %}
                {% endif %}
            {% endif %}

            {% set mesh_count_x = ([min_mesh_count, mesh_count_x]|max)|int %}
            {% set mesh_count_x = ([max_mesh_count, mesh_count_x]|min)|int %}
            {% set mesh_count_y = ([min_mesh_count, mesh_count_y]|max)|int %}
            {% set mesh_count_y = ([max_mesh_count, mesh_count_y]|min)|int %}

            # the prime blob height is probed before or after the mesh, whichever puts the probe
            # closer to the blob position at the end of the mesh
            {% set pxm = s.printable_y_max|string|lower %}
            {% set printable_y_max = printer.toolhead.axis_maximum.y if pxm == 'auto' else s.printable_y_max|float %}
            {% set should_prime = s.nozzle_priming|string|lower == 'primeblob' %}
            {% set start_y = s.nozzle_prime_start_y|string|lower %}
            {% set probe_first = start_y == "min" or (start_y not in ["min", "max"] and s.nozzle_prime_start_y|float(printable_y_max) < printable_y_max / 2) %}
            {% set mesh_runs = cfg.beacon.mesh_runs|default(1)|int %}
            {% if mesh_runs % 2 != 0 and probe_first %}
                {% set probe_first = false %}
            {% elif mesh_runs % 2 == 0 and not probe_first %}
                {% set probe_first = true %}
            {% endif %}

            # probe for priming
            {% if should_prime and probe_first %}
                BEACON_PROBE_FOR_PRIMING
            {% endif %}

            # mesh
            _BEACON_ECHO MSG="Adaptive Mesh: mesh coordinates X0={mesh_x0|round(1)} Y0={mesh_y0|round(1)} X1={mesh_x1|round(1)} Y1={mesh_y1|round(1)}"
            _BEACON_MESH_CALIBRATE PROFILE="{default_profile}" ALGORITHM={algorithm} MESH_MIN={mesh_x0},{mesh_y0} MESH_MAX={mesh_x1},{mesh_y1} PROBE_COUNT={mesh_count_x},{mesh_count_y}

            # probe for priming
            {% if should_prime and not probe_first %}
                BEACON_PROBE_FOR_PRIMING
            {% endif %}
        {% endif %}
    {% endif %}

# ---------------------------------------------------------------------------
# Priming
# ---------------------------------------------------------------------------
[gcode_macro _BEACON_SAVE_PROBE_RESULT]
description: Store the height difference of the last probe, VARIABLE=probe_for_priming_result or probe_for_priming_end_result
gcode:
    {% set s = printer["gcode_macro _BEACON_SETTINGS"] %}
    {% set current_z = printer.toolhead.position.z|float %}
    {% if s.beacon_contact_prime_probing|string|lower == 'true' %}
        {% set last_z_offset = printer.beacon.last_z_result %}
    {% else %}
        {% set last_z_offset = printer.beacon.last_sample.dist - current_z %}
    {% endif %}
    _BEACON_ECHO MSG="Adaptive Mesh: Saving offset adjustment of {last_z_offset} in {params.VARIABLE}"
    SET_GCODE_VARIABLE MACRO=_BEACON_PRINT_STATE VARIABLE={params.VARIABLE} VALUE={last_z_offset}

[gcode_macro BEACON_PROBE_CURRENT_POSITION]
description: Probe at the current position. Contact when beacon_contact_prime_probing is on, otherwise a proximity reading
gcode:
    {% set s = printer["gcode_macro _BEACON_SETTINGS"] %}
    SAVE_GCODE_STATE NAME=probe_current_position_state
    {% if s.beacon_contact_prime_probing|string|lower == 'true' %}
        PROBE PROBE_METHOD=contact SAMPLES=1
    {% else %}
        PROBE
    {% endif %}
    # leave the Beacon at scanning height and refresh its last sample
    BEACON_QUERY

[gcode_macro BEACON_RESET_PRIME_PROBE_STATE]
description: Forget the prime probe results
gcode:
    SET_GCODE_VARIABLE MACRO=_BEACON_PRINT_STATE VARIABLE=probe_for_priming_result VALUE=None
    SET_GCODE_VARIABLE MACRO=_BEACON_PRINT_STATE VARIABLE=probe_for_priming_end_result VALUE=None

[gcode_macro BEACON_PROBE_FOR_PRIMING]
description: Measure the bed height at the start and the end of the prime blob area
gcode:
    {% set s = printer["gcode_macro _BEACON_SETTINGS"] %}
    {% set cfg = printer.configfile.settings %}
    {% set rawcfg = printer.configfile.config %}
    {% set tp = printer.toolhead %}
    {% if s.nozzle_priming|string|lower != 'false' %}
        SAVE_GCODE_STATE NAME=probe_for_priming_state
        _BEACON_ECHO MSG="Adaptive Mesh: Probing the prime location.."

        # handle toolhead settings
        _BEACON_CACHE_TOOLHEAD_SETTINGS KEY="probe_for_priming"
        _BEACON_SET_MACRO_TRAVEL_SETTINGS

        # config
        {% set speed = s.macro_travel_speed|float * 60 %}
        {% set z_speed = s.macro_z_speed|float * 60 %}
        {% set pxm = s.printable_x_max|string|lower %}
        {% set pym = s.printable_y_max|string|lower %}
        {% set printable_x_max = tp.axis_maximum.x if pxm == 'auto' else s.printable_x_max|float %}
        {% set printable_y_max = tp.axis_maximum.y if pym == 'auto' else s.printable_y_max|float %}
        {% set start_x = s.nozzle_prime_start_x|string %}
        {% set start_y = s.nozzle_prime_start_y|string %}
        {% set disable_constraints = s.probe_for_priming_disable_mesh_constraints|string|lower == 'true' %}

        # prime blob start position
        {% if start_x|lower == 'min' %}
            {% set x_start = 5 %}
        {% elif start_x|lower == 'max' %}
            {% set x_start = printable_x_max - 5 %}
        {% else %}
            {% set x_start = start_x|float %}
        {% endif %}
        {% if start_y|lower == 'min' %}
            {% set y_start = 5 %}
        {% elif start_y|lower == 'max' %}
            {% set y_start = printable_y_max - 5 %}
        {% else %}
            {% set y_start = start_y|float %}
        {% endif %}
        {% set z = cfg.bed_mesh.horizontal_move_z|default(5)|float %}

        # Beacon offsets
        {% set x_offset = cfg.beacon.x_offset|default(0)|float %}
        {% set y_offset = cfg.beacon.y_offset|default(0)|float %}
        {% set z_offset = cfg.beacon.trigger_distance|default(2.0)|float %}
        {% if z < z_offset %}
            { action_raise_error("Horizontal move Z (%s) is below the Beacon trigger distance (%s). Please set horizontal_move_z in [bed_mesh] above it." % (z, z_offset)) }
        {% endif %}

        {% if not disable_constraints %}
            # make sure the probe coordinates lie within the configured mesh area
            {% set mesh_min = rawcfg.bed_mesh.mesh_min.split(",") %}
            {% set mesh_max = rawcfg.bed_mesh.mesh_max.split(",") %}
            {% set min_x = mesh_min[0]|float - x_offset %}
            {% set min_y = mesh_min[1]|float - y_offset %}
            {% set max_x = mesh_max[0]|float - x_offset %}
            {% set max_y = mesh_max[1]|float - y_offset %}
            {% set x_start = [[x_start, max_x]|min, min_x]|max %}
            {% set y_start = [[y_start, max_y]|min, min_y]|max %}
        {% endif %}

        _BEACON_ECHO MSG="Adaptive Mesh: Probing the start of the prime location at {x_start}, {y_start}"
        # absolute positioning, relative extrusion
        G90
        M83
        # lift to horizontal_move_z
        G0 Z{z} F{z_speed}
        # move close to the blob position
        G1 X{x_start} Y{y_start} F{speed}
        BEACON_PROBE_CURRENT_POSITION
        _BEACON_SAVE_PROBE_RESULT VARIABLE=probe_for_priming_result

        # The blob runs along Y, away from the start position. The end probe goes the same way.
        # (RatOS always probes towards +Y, which leaves the bed when the blob starts at the back.)
        {% if s.nozzle_prime_direction|string|lower == 'forwards' %}
            {% set y_factor = 1 %}
        {% elif s.nozzle_prime_direction|string|lower == 'backwards' %}
            {% set y_factor = -1 %}
        {% elif start_y|lower == 'min' %}
            {% set y_factor = 1 %}
        {% elif start_y|lower == 'max' %}
            {% set y_factor = -1 %}
        {% elif start_y|float < printable_y_max / 2 %}
            {% set y_factor = 1 %}
        {% else %}
            {% set y_factor = -1 %}
        {% endif %}
        {% set x_end = x_start %}
        {% set y_end = y_start + 45 * y_factor %}
        _BEACON_ECHO MSG="Adaptive Mesh: Probing the end of the prime location at {x_end}, {y_end}"
        G1 X{x_end} Y{y_end} F{speed}
        BEACON_PROBE_CURRENT_POSITION
        _BEACON_SAVE_PROBE_RESULT VARIABLE=probe_for_priming_end_result

        RESTORE_GCODE_STATE NAME=probe_for_priming_state

        # handle toolhead settings
        _BEACON_RESTORE_TOOLHEAD_SETTINGS KEY="probe_for_priming"
    {% endif %}

[gcode_macro _PRIME]
description: Prime the nozzle (RatOS name, customizable)
gcode:
    {% set s = printer["gcode_macro _BEACON_SETTINGS"] %}
    {% if s.nozzle_priming|string|lower == 'primeblob' or s.nozzle_priming|string|lower == 'primeline' %}
        BEACON_PRIME_BLOB
    {% endif %}

[gcode_macro BEACON_PRIME_BLOB]
description: Print a prime blob, used by START_PRINT when nozzle_priming is primeblob
gcode:
    # handle toolhead settings
    _BEACON_CACHE_TOOLHEAD_SETTINGS KEY="prime_blob"
    _BEACON_SET_MACRO_TRAVEL_SETTINGS

    {% set s = printer["gcode_macro _BEACON_SETTINGS"] %}
    {% set state = printer["gcode_macro _BEACON_PRINT_STATE"] %}
    {% set tp = printer.toolhead %}
    {% set extruder = s.extruder %}

    _BEACON_ECHO MSG="Priming: Priming nozzle with prime blob.."

    # save gcode state
    SAVE_GCODE_STATE NAME=prime_blob_state

    # config
    {% set pxm = s.printable_x_max|string|lower %}
    {% set pym = s.printable_y_max|string|lower %}
    {% set printable_x_max = tp.axis_maximum.x if pxm == 'auto' else s.printable_x_max|float %}
    {% set printable_y_max = tp.axis_maximum.y if pym == 'auto' else s.printable_y_max|float %}
    {% set speed = s.macro_travel_speed|float * 60 %}
    {% set z_speed = s.macro_z_speed|float * 60 %}
    {% set fan_speed = s.nozzle_prime_bridge_fan|float %}
    {% set nozzle_diameter = printer.configfile.settings[extruder].nozzle_diameter|float %}
    {% set has_start_offset = state.probe_for_priming_result|float(9999.9) != 9999.9 %}
    {% set park_in = s.start_print_park_in|string|lower %}
    {% set park_z = s.start_print_park_z_height|float %}
    {% set direction = s.nozzle_prime_direction|string|lower %}
    {% set start_x = s.nozzle_prime_start_x|string %}
    {% set start_y = s.nozzle_prime_start_y|string %}

    # calculation
    {% set x_factor = 0 %}
    {% if start_x|lower == 'min' %}
        {% set x_start = 5 %}
    {% elif start_x|lower == 'max' %}
        {% set x_start = printable_x_max - 5 %}
    {% else %}
        {% set x_start = start_x|float %}
    {% endif %}
    {% if start_y|lower == 'min' %}
        {% set y_start = 5 %}
        {% set y_factor = 1 %}
    {% elif start_y|lower == 'max' %}
        {% set y_start = printable_y_max - 5 %}
        {% set y_factor = -1 %}
    {% else %}
        {% set y_start = start_y|float %}
        {% if start_y|float < printable_y_max / 2 %}
            {% set y_factor = 1 %}
        {% else %}
            {% set y_factor = -1 %}
        {% endif %}
    {% endif %}
    {% if direction == 'forwards' %}
        {% set y_factor = 1 %}
    {% elif direction == 'backwards' %}
        {% set y_factor = -1 %}
    {% endif %}
    {% if park_in == 'primeblob' %}
        {% set z = 3 %}
    {% else %}
        {% set z = park_z %}
    {% endif %}

    {% set start_z_offset = 0 %}
    {% set end_z_offset = 0 %}
    {% if has_start_offset %}
        {% set start_z_probe_result = state.probe_for_priming_result|float(9999.9) %}
        {% set end_z_probe_result = state.probe_for_priming_end_result|float(9999.9) %}
        {% if end_z_probe_result == 9999.9 %}
            { action_raise_error("No end probe result found for prime area. This is likely a bug.") }
        {% endif %}
        {% set threshold = s.adaptive_prime_offset_threshold|float %}
        {% if start_z_probe_result < threshold %}
            { action_raise_error("Abnormal probe offset detected. Needed offset of %.5f is below the offset threshold of %.2fmm. Please verify the Beacon is over the bed when probing for priming. If it isn't, adjust the bed_mesh min/max so the probe is always over the print area." % (start_z_probe_result, threshold)) }
        {% endif %}
        {% if end_z_probe_result < threshold %}
            { action_raise_error("Abnormal probe offset detected. Needed offset of %.5f is below the offset threshold of %.2fmm. Please verify the Beacon is over the bed when probing for priming. If it isn't, adjust the bed_mesh min/max so the probe is always over the print area." % (end_z_probe_result, threshold)) }
        {% endif %}
        {% set start_z_offset = start_z_probe_result %}
        {% set end_z_offset = end_z_probe_result %}
    {% endif %}

    # set the nozzle thermal expansion offset
    {% if printer["gcode_macro _BEACON_UPDATE_NOZZLE_TEMP_OFFSET"] is defined %}
        _BEACON_UPDATE_NOZZLE_TEMP_OFFSET
    {% endif %}

    _BEACON_DEBUG MSG="PRIME_BLOB x_start: {x_start}, y_start: {y_start}, x_factor: {x_factor}, y_factor: {y_factor}, z: {z}, start_z_offset: {start_z_offset}, end_z_offset: {end_z_offset}"

    # absolute positioning, relative extrusion
    G90
    M83
    _BEACON_ECHO MSG="Priming: Lifting Z to {z}.."
    # lift to start print Z height
    G0 Z{z} F{z_speed}

    # move close to the blob position along the edge of the bed
    _BEACON_ECHO MSG="Priming: Moving to {x_start}, {y_start} along the edge of the print area.."
    {% if park_in != 'primeblob' %}
        G1 X{x_start} F{speed}
        G1 Y{y_start + (15 * y_factor)} F{speed}
    {% endif %}

    _BEACON_ECHO MSG="Priming: Starting prime blob.."
    # lower to blob extrusion height
    G1 Z{0.5 + start_z_offset} F{z_speed}
    # move to the final position horizontally
    G1 Y{y_start} F{speed}
    # extrude a blob (split in two moves to avoid thresholds and limit the blob size)
    G1 F300 E{14 / ((0.4 / [nozzle_diameter|float, 0.6]|min) ** 2)}
    G1 F300 E{14 / ((0.4 / [nozzle_diameter|float, 0.6]|min) ** 2)}
    # part fan
    M106 S{fan_speed}
    # move the extruder up by 5mm while extruding, breaks away from the blob
    G1 Z5 F100 E5
    G92 E0
    _BEACON_ECHO MSG="Priming: Bridging with {((fan_speed/255) * 100)|int}% fan speed.."
    # move to the wipe position, but keep extruding so the wipe is attached to the blob
    G1 F3000 X{x_start + (15 * x_factor)} Y{y_start + (15 * y_factor)} E{1 / ((0.4 / nozzle_diameter) ** 2)}
    # go down diagonally while extruding
    # broken down in z moves under 2mm as a workaround for a tuning tower test
    G1 F3000 X{x_start + (20 * x_factor)} Y{y_start + (20 * y_factor)} Z{3.8 + end_z_offset} E{0.2 / ((0.4 / nozzle_diameter) ** 2)}
    G1 F3000 X{x_start + (34 * x_factor)} Y{y_start + (34 * y_factor)} Z{2.6 + end_z_offset} E{0.2 / ((0.4 / nozzle_diameter) ** 2)}
    G1 F3000 X{x_start + (38 * x_factor)} Y{y_start + (38 * y_factor)} Z{1.4 + end_z_offset} E{0.2 / ((0.4 / nozzle_diameter) ** 2)}
    G1 F3000 X{x_start + (42 * x_factor)} Y{y_start + (42 * y_factor)} Z{0.2 + end_z_offset} E{0.2 / ((0.4 / nozzle_diameter) ** 2)}
    # fan off
    M106 S0
    # small wipe line
    G1 F3000 X{x_start + (46 * x_factor)} Y{y_start + (46 * y_factor)} Z{0.2 + end_z_offset} E0.6
    # break away wipe
    G1 F{speed} X{x_start + (50 * x_factor)} Y{y_start + (50 * y_factor)}

    # restore gcode state
    RESTORE_GCODE_STATE NAME=prime_blob_state

    # handle toolhead settings
    _BEACON_RESTORE_TOOLHEAD_SETTINGS KEY="prime_blob"

    # reset extrusion distance
    G92 E0

# ---------------------------------------------------------------------------
# After heating the extruder: prime and move to the print area
# ---------------------------------------------------------------------------
[gcode_macro _START_PRINT_AFTER_HEATING_EXTRUDER]
description: Prime the nozzle and move to the first print position
gcode:
    {% set s = printer["gcode_macro _BEACON_SETTINGS"] %}
    {% set tp = printer.toolhead %}
    {% set z_speed = s.macro_z_speed|float * 60 %}
    {% set speed = s.macro_travel_speed|float * 60 %}
    {% set first_x = printer["gcode_macro START_PRINT"].first_x|default(-1)|float %}
    {% set first_y = printer["gcode_macro START_PRINT"].first_y|default(-1)|float %}
    {% set pxm = s.printable_x_max|string|lower %}
    {% set pym = s.printable_y_max|string|lower %}
    {% set printable_x_max = tp.axis_maximum.x if pxm == 'auto' else s.printable_x_max|float %}
    {% set printable_y_max = tp.axis_maximum.y if pym == 'auto' else s.printable_y_max|float %}
    {% set center_x = printable_x_max / 2.0 %}
    {% set center_y = printable_y_max / 2.0 %}

    # parameters
    {% set X0 = params.X0|default(-1)|int %}
    {% set X1 = params.X1|default(-1)|int %}
    {% set Y0 = params.Y0|default(-1)|int %}
    {% set Y1 = params.Y1|default(-1)|int %}

    _PRIME

    # handle toolhead settings
    _BEACON_CACHE_TOOLHEAD_SETTINGS KEY="start_print_after_heating_extruder"
    _BEACON_SET_MACRO_TRAVEL_SETTINGS

    {% if (X0 > -1 and Y1 > -1) or (first_x > 0 and first_y > 0) %}
        # z-hop after priming
        G0 Z3 F{z_speed}

        # safe first z
        {% set first_z = 3 %}

        # move to the print area
        {% if first_x >= 0 and first_y >= 0 %}
            G0 X{first_x} Y{first_y} Z{first_z} F{speed}
        {% else %}
            {% set first_x = X0 %}
            {% set first_y = Y0 %}
            {% if s.nozzle_priming|string|lower == 'primeblob' or s.nozzle_priming|string|lower == 'primeline' %}
                {% if s.nozzle_prime_start_x|string|lower == 'min' %}
                    {% set first_x = X0 %}
                {% elif s.nozzle_prime_start_x|string|lower == 'max' %}
                    {% set first_x = X1 %}
                {% else %}
                    {% if s.nozzle_prime_start_x|float <= center_x %}
                        {% set first_x = X0 %}
                    {% else %}
                        {% set first_x = X1 %}
                    {% endif %}
                {% endif %}
                {% if s.nozzle_prime_start_y|string|lower == 'min' %}
                    {% set first_y = Y0 %}
                {% elif s.nozzle_prime_start_y|string|lower == 'max' %}
                    {% set first_y = Y1 %}
                {% else %}
                    {% if s.nozzle_prime_start_y|float <= center_y %}
                        {% set first_y = Y0 %}
                    {% else %}
                        {% set first_y = Y1 %}
                    {% endif %}
                {% endif %}
            {% endif %}
            G0 X{first_x} Y{first_y} Z{first_z} F{speed}
        {% endif %}
    {% endif %}

    # handle toolhead settings
    _BEACON_RESTORE_TOOLHEAD_SETTINGS KEY="start_print_after_heating_extruder"

# ---------------------------------------------------------------------------
# Parking
# ---------------------------------------------------------------------------
[gcode_macro _BEACON_PARK]
description: Park the gantry. LOCATION=back|front|center|primeblob X=position (empty = middle)
gcode:
    {% set s = printer["gcode_macro _BEACON_SETTINGS"] %}
    {% set tp = printer.toolhead %}
    {% set x = params.X|default("")|string %}
    {% set location = params.LOCATION|default('back')|string|lower %}
    {% set pxm = s.printable_x_max|string|lower %}
    {% set pym = s.printable_y_max|string|lower %}
    {% set printable_x_max = tp.axis_maximum.x if pxm == 'auto' else s.printable_x_max|float %}
    {% set printable_y_max = tp.axis_maximum.y if pym == 'auto' else s.printable_y_max|float %}
    {% set speed = s.macro_travel_speed|float * 60 %}
    {% set start_x = s.nozzle_prime_start_x|string|lower %}
    {% set start_y = s.nozzle_prime_start_y|string|lower %}
    {% set nozzle_priming = s.nozzle_priming|string|lower %}

    # handle toolhead settings
    _BEACON_CACHE_TOOLHEAD_SETTINGS KEY="park"
    _BEACON_SET_MACRO_TRAVEL_SETTINGS

    # X position
    {% if x != '' %}
        {% if x|float >= tp.axis_minimum.x + 5 and x|float <= printable_x_max - 5 %}
            {% set park_x = x|float %}
        {% else %}
            { action_respond_info('The requested X co-ordinate is outside the defined axis bounds - using defaults') }
            {% set park_x = printable_x_max / 2 %}
        {% endif %}
    {% else %}
        {% set park_x = printable_x_max / 2 %}
    {% endif %}

    # Y position, default location is back
    {% set park_y = printable_y_max - 15 %}
    {% if location == 'front' %}
        {% set park_y = tp.axis_minimum.y + 5 %}
    {% elif location == 'center' %}
        {% set park_y = printable_y_max / 2 %}
    {% endif %}

    # prime blob parking
    {% if location == 'primeblob' %}
        {% if nozzle_priming == 'primeblob' or nozzle_priming == 'primeline' %}
            {% if start_x == 'min' %}
                {% set park_x = 5 %}
            {% elif start_x == 'max' %}
                {% set park_x = printable_x_max - 5 %}
            {% else %}
                {% set park_x = start_x|float %}
            {% endif %}
            {% if start_y == 'min' %}
                {% set park_y = 5 %}
            {% elif start_y == 'max' %}
                {% set park_y = printable_y_max - 5 %}
            {% else %}
                {% set park_y = start_y|float %}
            {% endif %}
        {% endif %}
    {% endif %}

    G90
    G0 X{park_x} Y{park_y} F{speed}

    # handle toolhead settings
    _BEACON_RESTORE_TOOLHEAD_SETTINGS KEY="park"

[gcode_macro _START_PRINT_PARK]
description: Park the gantry while the nozzle heats
gcode:
    {% set s = printer["gcode_macro _BEACON_SETTINGS"] %}
    {% set z = s.start_print_park_z_height|float %}
    {% set z_speed = s.macro_z_speed|float * 60 %}
    {% set park_in = s.start_print_park_in|string|lower %}
    {% if park_in == 'primeblob' %}
        {% set z = 3 %}
    {% endif %}
    _BEACON_PARK LOCATION={park_in} X="{s.start_print_park_x}"
    G0 Z{z} F{z_speed}

[gcode_macro _END_PRINT_PARK]
description: Park the gantry after the print
gcode:
    {% set s = printer["gcode_macro _BEACON_SETTINGS"] %}
    _BEACON_PARK LOCATION={s.end_print_park_in|string|lower} X="{s.end_print_park_x}"

# ---------------------------------------------------------------------------
# Z offset and extrusion mode
# ---------------------------------------------------------------------------
[gcode_macro _BEACON_SET_EXTRUSION_MODE]
description: Absolute or relative extrusion, as set by relative_extrusion
gcode:
    {% if printer["gcode_macro _BEACON_SETTINGS"].relative_extrusion|string|lower == 'true' %}
        M83
    {% else %}
        M82
    {% endif %}

[gcode_macro _BEACON_ALERT_NON_ZERO_Z_OFFSET]
description: Tell the user when a G-code Z offset is active
gcode:
    {% set force = params.FORCE|default(0)|int == 1 %}
    {% set gcode_offset = printer.gcode_move.homing_origin.z|float %}
    {% set nozzle = printer["gcode_macro _BEACON_UPDATE_NOZZLE_TEMP_OFFSET"].applied_offset|default(0)|float %}
    {% set user_offset = gcode_offset - nozzle %}
    {% if force or user_offset > 0.0000001 or user_offset < -0.0000001 %}
        _BEACON_ECHO TITLE="User-adjusted Z-offset of {'%.3f' % user_offset} mm is active" MSG="G-code Z-offset: {'%.3f' % user_offset} mm (not counting the nozzle expansion offset of {'%.3f' % nozzle} mm)"
    {% endif %}

# ---------------------------------------------------------------------------
# END_PRINT
# ---------------------------------------------------------------------------
[gcode_macro END_PRINT]
description: End print procedure, use this in your slicer. Also called by CANCEL_PRINT.
gcode:
    {% set s = printer["gcode_macro _BEACON_SETTINGS"] %}

    # reset is_printing_gcode state
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=is_printing_gcode VALUE=False

    # save gcode state
    SAVE_GCODE_STATE NAME=end_print_state

    # run end print macros
    _USER_END_PRINT_BEFORE_HEATERS_OFF {rawparams}
    _END_PRINT_BEFORE_HEATERS_OFF
    TURN_OFF_HEATERS
    _USER_END_PRINT_AFTER_HEATERS_OFF {rawparams}
    _END_PRINT_AFTER_HEATERS_OFF
    _USER_END_PRINT_PARK {rawparams}
    _END_PRINT_PARK

    # turn the motors off
    {% if s.end_print_motors_off|string|lower != 'false' %}
        M84
    {% endif %}

    # part cooling fan off
    M107

    # clear the bed mesh so that G28 does not fail
    BED_MESH_CLEAR
    _BEACON_ECHO MSG="Done :)"

    # restore gcode state
    RESTORE_GCODE_STATE NAME=end_print_state

    # remove the thermal expansion offset, as RatOS does at end_print
    {% if printer["gcode_macro BEACON_RESET_NOZZLE_TEMP_OFFSET"] is defined %}
        BEACON_RESET_NOZZLE_TEMP_OFFSET
    {% endif %}

    # restore toolhead settings
    _BEACON_RESTORE_TOOLHEAD_SETTINGS KEY="start_print"

    # chamber heater control
    _BEACON_HOOK_CHAMBER_OFF

    _USER_END_PRINT_FINISHED {rawparams}

[gcode_macro _END_PRINT_BEFORE_HEATERS_OFF]
gcode:
    _BEACON_ECHO MSG="Cleaning up..."

[gcode_macro _END_PRINT_AFTER_HEATERS_OFF]
gcode:
    {% set s = printer["gcode_macro _BEACON_SETTINGS"] %}

    # calculate a safe Z lift
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set current_z = printer.toolhead.position.z|float %}
    {% set z_hop = s.end_print_park_z_hop|float %}
    {% set r = s.end_print_retract_filament|float %}
    {% if current_z < (max_z - z_hop) %}
        {% set z_safe = z_hop %}
    {% else %}
        {% set z_safe = max_z - current_z %}
    {% endif %}

    # can the extruder extrude
    {% set can_extrude = printer[s.extruder].can_extrude|string|lower == 'true' %}

    # relative positioning
    G91
    # retract the filament a bit before lifting the nozzle
    {% if can_extrude %}
        G1 E-2 F3600
    {% endif %}
    # move to the safe Z position
    G0 Z{z_safe} F3600
    # retract the filament even more
    {% if can_extrude %}
        G1 E-{(r - 2)} F3600
    {% endif %}
    # back to absolute positioning
    G90
