# beacon_cancel_print.cfg
#
# CANCEL_PRINT that runs END_PRINT, as in RatOS. Optional. It replaces the
# CANCEL_PRINT of Klipper's [pause_resume], so your printer.cfg needs a
# [pause_resume] section (and a [virtual_sdcard]). Include it AFTER
# beacon_print.cfg:
#
#   [include beacon_macros/beacon_print.cfg]
#   [include beacon_macros/beacon_cancel_print.cfg]
#
# Do not include it if another file already renames CANCEL_PRINT (Mainsail and
# Fluidd macro sets often do), Klipper would refuse to start.

[gcode_macro CANCEL_PRINT]
description: Cancels the print
rename_existing: CANCEL_PRINT_BASE
gcode:
    _BEACON_ECHO MSG="Cancelling print..."
    END_PRINT
    TURN_OFF_HEATERS
    CLEAR_PAUSE
    CANCEL_PRINT_BASE
    _BEACON_ECHO MSG="Print cancelled"
