# beacon_heater_hooks.cfg  (OPTIONAL)
#
# Makes the thermal expansion Z offset follow every change of the extruder
# target temperature automatically, like RatOS does. It wraps M104, M109 and
# SET_HEATER_TEMPERATURE. The wrapped commands behave exactly as before and
# then call _BEACON_UPDATE_NOZZLE_TEMP_OFFSET, which does nothing until
# BEACON_TRUE_ZERO (or BEACON_APPLY_NOZZLE_TEMP_OFFSET) has switched it on.
#
# Do not include this file if your printer.cfg or another config already
# renames M104, M109 or SET_HEATER_TEMPERATURE. Without this file, call
# _BEACON_UPDATE_NOZZLE_TEMP_OFFSET yourself after changing the temperature.
#
# Based on the Beacon macros of RatOS (GPL-3.0). See README.md.

[gcode_macro M104]
rename_existing: M104.1
description: Set extruder temperature (wrapped by the Beacon macro set)
gcode:
    M104.1 {rawparams}
    _BEACON_UPDATE_NOZZLE_TEMP_OFFSET

[gcode_macro M109]
rename_existing: M109.1
description: Set extruder temperature and wait (wrapped by the Beacon macro set)
gcode:
    # set the target first so the offset is applied while heating
    M104.1 {rawparams}
    _BEACON_UPDATE_NOZZLE_TEMP_OFFSET
    M109.1 {rawparams}

[gcode_macro SET_HEATER_TEMPERATURE]
rename_existing: _BEACON_BASE_SET_HEATER_TEMPERATURE
description: Set a heater target (wrapped by the Beacon macro set)
gcode:
    _BEACON_BASE_SET_HEATER_TEMPERATURE {rawparams}
    _BEACON_UPDATE_NOZZLE_TEMP_OFFSET
