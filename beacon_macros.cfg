# beacon_macros.cfg
#
# Standalone Beacon macro set for Klipper and Kalico, extracted from the
# Beacon macros of RatOS. Include this one file from your printer.cfg:
#
#   [include beacon_macros/beacon_macros.cfg]
#
# Your own settings go into printer.cfg, after the include. See README.md.
#
# The extras (scan compensation, adaptive heat soak, multi-point true zero) need
# the Python modules in klippy_extras/ (run install.sh). After installing them,
# also include, AFTER this file:
#
#   [include beacon_macros/beacon_extras.cfg]

[include beacon_settings.cfg]
[include beacon_common.cfg]
[include beacon_calibration.cfg]
[include beacon_runtime.cfg]

# Optional: keeps the thermal expansion Z offset in step with the extruder
# temperature. Remove the hash sign to enable, see the notes in the file.
# [include beacon_heater_hooks.cfg]
