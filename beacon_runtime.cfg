# beacon_runtime.cfg
#
# Macros you use while printing:
#   BEACON_TRUE_ZERO                     contact Z=0 on the hot bed (optional probe clean and fuzzy position)
#   BEACON_PROBE_CLEAN                   series of contact probes that wipe the nozzle tip
#   BEACON_APPLY_NOZZLE_TEMP_OFFSET      start following the nozzle temperature with a Z offset
#   BEACON_RESET_NOZZLE_TEMP_OFFSET      remove that offset again
#   _BEACON_UPDATE_NOZZLE_TEMP_OFFSET    recompute the offset from the current extruder target
#   BEACON_BED_MESH                      bed mesh with proximity or contact, as configured
#   BEACON_HOME_Z                        Z homing for use inside homing_override
#   BEACON_PREFLIGHT_CHECK               checks configuration and settings for common mistakes
#
# Based on the Beacon macros of RatOS (GPL-3.0). See README.md.

# ---------------------------------------------------------------------------
# State kept between macro runs. Do not edit.
# ---------------------------------------------------------------------------
[gcode_macro _BEACON_STATE]
description: Internal state of the Beacon macro set
variable_true_zero_x: -1
variable_true_zero_y: -1
variable_true_zero_done: False
gcode:
    {% set unused = 0 %}

[gcode_macro _BEACON_STORE_TRUE_ZERO_POSITION]
description: Remember the XY position of the last true zero measurement
gcode:
    {% set pos = printer.toolhead.position %}
    SET_GCODE_VARIABLE MACRO=_BEACON_STATE VARIABLE=true_zero_x VALUE={pos[0]|float}
    SET_GCODE_VARIABLE MACRO=_BEACON_STATE VARIABLE=true_zero_y VALUE={pos[1]|float}

[gcode_macro _BEACON_MARK_TRUE_ZERO_DONE]
description: Remember that a true zero has been measured
gcode:
    SET_GCODE_VARIABLE MACRO=_BEACON_STATE VARIABLE=true_zero_done VALUE=True

# ---------------------------------------------------------------------------
# Probe clean
# ---------------------------------------------------------------------------
[gcode_macro _BEACON_PROBE_CLEAN_STAMP]
description: Press the nozzle slightly below the last contact result and lift again
gcode:
    # this macro is called after a probe, so the last result is read when it runs
    {% set last_z = printer.beacon.last_z_result|float %}
    {% set depth = params.DEPTH|default(0.1)|float %}
    {% set wait = params.WAIT|default(200)|int %}
    {% set z_speed = params.Z_SPEED|default(900)|float %}
    G0 Z{last_z - depth} F{z_speed}
    G4 P{wait}
    G0 Z2 F{z_speed}

[gcode_macro BEACON_PROBE_CLEAN]
description: Series of contact probes that displace filament from the nozzle tip. X= Y= COUNT=6 SPACING= STAMP=1 STAMP_SKIP=0 STAMP_DEPTH=0.1 STAMP_WAIT=200
gcode:
    {% set s = printer["gcode_macro _BEACON_SETTINGS"] %}
    {% set speed = s.macro_travel_speed|float * 60 %}
    {% set z_speed = s.macro_z_speed|float * 60 %}

    {% if printer.beacon is not defined %}
        { action_raise_error("BEACON_PROBE_CLEAN: Beacon is not configured") }
    {% endif %}
    {% if params.X is not defined or params.Y is not defined %}
        { action_raise_error("BEACON_PROBE_CLEAN: X and Y are required, for example BEACON_PROBE_CLEAN X=50 Y=10") }
    {% endif %}
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        { action_raise_error("BEACON_PROBE_CLEAN: home the printer first") }
    {% endif %}

    # nozzle tip diameter estimate, used as the default spacing between probes
    {% set nozzle = printer.configfile.settings[s.extruder].nozzle_diameter|float %}
    {% if nozzle < 0.25 %}
        {% set tip = 1.5 * nozzle %}
    {% elif nozzle <= 0.8 %}
        {% set tip = 2.5 * nozzle %}
    {% else %}
        {% set tip = nozzle + 1.35 %}
    {% endif %}

    {% set x = params.X|float %}
    {% set y = params.Y|float %}
    {% set count = [params.COUNT|default(6)|int, 1]|max %}
    {% set spacing = [params.SPACING|default(tip)|float, 0.0]|max %}
    {% set stamp = params.STAMP|default('1')|string|lower in ['1', 'true', 'yes'] %}
    {% set stamp_skip = [params.STAMP_SKIP|default(0)|int, 0]|max %}
    {% set stamp_depth = [[params.STAMP_DEPTH|default(0.1)|float, 0.0]|max, 0.2]|min %}
    {% set stamp_wait = [params.STAMP_WAIT|default(200)|int, 0]|max %}

    # move to the start position. The first probe is discarded because first values can be unreliable.
    G0 Z5 F{z_speed}
    G0 X{x} Y{y} F{speed}
    PROBE PROBE_METHOD=contact SAMPLES=1

    {% for i in range(count) %}
        G0 X{x + i * spacing} F{speed}
        PROBE PROBE_METHOD=contact SAMPLES=1
        {% if stamp and i >= stamp_skip %}
            _BEACON_PROBE_CLEAN_STAMP DEPTH={stamp_depth} WAIT={stamp_wait} Z_SPEED={z_speed}
        {% endif %}
    {% endfor %}
    G0 Z5 F{z_speed}

# ---------------------------------------------------------------------------
# True zero
# ---------------------------------------------------------------------------
[gcode_macro BEACON_TRUE_ZERO]
description: Measure Z=0 with contact at the configured nozzle temperature. Run it with the bed at printing temperature, after leveling. HOTEND_SOAK=0 skips the hotend soak (START_PRINT does that itself).
gcode:
    {% set s = printer["gcode_macro _BEACON_SETTINGS"] %}
    {% set z_speed = s.macro_z_speed|float * 60 %}
    {% set speed = s.macro_travel_speed|float * 60 %}
    {% set temp = s.beacon_contact_true_zero_temp|float %}
    {% set heater = s.extruder %}
    {% set wipe = s.beacon_contact_wipe_before_true_zero|string|lower == 'true' %}
    {% set method = s.beacon_contact_wipe_before_true_zero_method|string|lower %}
    {% set calibrate_model = s.beacon_contact_calibrate_model_on_true_zero|string|lower == 'true' %}
    {% set fuzzy = s.beacon_contact_start_print_true_zero_fuzzy_position|string|lower == 'true' %}
    {% set radius = s.beacon_contact_start_print_true_zero_fuzzy_radius|float if fuzzy else 0 %}
    {% set ns = namespace(heated=False) %}

    {% if printer.beacon is not defined %}
        { action_raise_error("BEACON_TRUE_ZERO: Beacon is not configured") }
    {% endif %}

    _BEACON_MAYBE_HOME
    _BEACON_HOOK_LED_START

    # remove an earlier thermal expansion offset so the measurement is made without it
    BEACON_RESET_NOZZLE_TEMP_OFFSET

    {% if wipe %}
        {% if method == "probe_clean" %}
            G0 Z5 F{z_speed}
            G0 X{s.beacon_contact_wipe_x|float} Y{s.beacon_contact_wipe_y|float} F{speed}
            _BEACON_ECHO MSG="Heating extruder to probing temperature..."
            SET_HEATER_TEMPERATURE HEATER={heater} TARGET={temp}
            TEMPERATURE_WAIT SENSOR={heater} MINIMUM={temp} MAXIMUM={temp + 5}
            {% set ns.heated = True %}
            BEACON_PROBE_CLEAN X={s.beacon_contact_wipe_x|float} Y={s.beacon_contact_wipe_y|float}
        {% else %}
            _BEACON_ECHO TYPE=error TITLE="Unknown wipe method" MSG="Wipe method '{method}' is not supported, skipping the wipe. Use probe_clean."
        {% endif %}
    {% endif %}

    # move to the (optionally fuzzy) measuring position
    G0 Z5 F{z_speed}
    _BEACON_MOVE_TO_SAFE_Z_HOME FUZZY_RADIUS={radius}
    _BEACON_STORE_TRUE_ZERO_POSITION

    {% if not ns.heated %}
        _BEACON_ECHO MSG="Heating extruder to probing temperature..."
        SET_HEATER_TEMPERATURE HEATER={heater} TARGET={temp}
        TEMPERATURE_WAIT SENSOR={heater} MINIMUM={temp} MAXIMUM={temp + 5}
    {% endif %}

    {% if s.hotend_heat_soak_time|float > 0 and params.HOTEND_SOAK|default(1)|int != 0 %}
        _BEACON_ECHO MSG="Hotend heat soak for {s.hotend_heat_soak_time|float|round(0)|int} seconds..."
        G4 P{s.hotend_heat_soak_time|float * 1000}
    {% endif %}

    # the critical probe
    _BEACON_ECHO MSG="Beacon contact auto calibration..."
    {% if calibrate_model %}
        BEACON_AUTO_CALIBRATE
    {% else %}
        BEACON_AUTO_CALIBRATE SKIP_MODEL_CREATION=1
    {% endif %}
    G0 Z5 F{z_speed}

    _BEACON_MARK_TRUE_ZERO_DONE
    _BEACON_HOOK_LED_END

    # from here on the Z offset follows the nozzle temperature (if enabled)
    BEACON_APPLY_NOZZLE_TEMP_OFFSET

# ---------------------------------------------------------------------------
# Nozzle temperature (thermal expansion) offset
# ---------------------------------------------------------------------------
[gcode_macro _BEACON_UPDATE_NOZZLE_TEMP_OFFSET]
description: Set the Z offset for the current extruder target temperature. Does nothing until BEACON_APPLY_NOZZLE_TEMP_OFFSET has run.
variable_active: False
variable_applied_offset: 0.0
gcode:
    {% set s = printer["gcode_macro _BEACON_SETTINGS"] %}
    {% set me = printer["gcode_macro _BEACON_UPDATE_NOZZLE_TEMP_OFFSET"] %}
    {% set enabled = s.beacon_contact_expansion_compensation|string|lower == 'true' %}
    {% set true_zero = s.beacon_contact_start_print_true_zero|string|lower == 'true' %}
    {% set target = printer[s.extruder].target|float %}
    {% if me.active and enabled and true_zero and target >= 1 %}
        {% set coefficient = printer.save_variables.variables.nozzle_expansion_coefficient_t0|default(0)|float %}
        {% set offset = (target - s.beacon_contact_true_zero_temp|float) * (coefficient / 100) %}
        {% set delta = offset - me.applied_offset|float %}
        {% if delta > 0.000001 or delta < -0.000001 %}
            {% set move = 1 if 'z' in printer.toolhead.homed_axes else 0 %}
            SET_GCODE_OFFSET Z_ADJUST={delta} MOVE={move} MOVE_SPEED={s.macro_z_speed|float}
            SET_GCODE_VARIABLE MACRO=_BEACON_UPDATE_NOZZLE_TEMP_OFFSET VARIABLE=applied_offset VALUE={offset}
            _BEACON_ECHO MSG="Nozzle expansion offset of {'%.6f' % offset}mm applied"
        {% endif %}
    {% endif %}

[gcode_macro BEACON_APPLY_NOZZLE_TEMP_OFFSET]
description: Start applying the thermal expansion Z offset and update it for the current extruder target
gcode:
    {% set s = printer["gcode_macro _BEACON_SETTINGS"] %}
    {% if s.beacon_contact_expansion_compensation|string|lower == 'true' %}
        {% if printer.save_variables.variables.nozzle_expansion_coefficient_t0 is not defined %}
            _BEACON_ECHO TYPE=warning TITLE="No expansion coefficient" MSG="Run BEACON_CALIBRATE_NOZZLE_TEMP_OFFSET (or BEACON_FULL_CALIBRATE) first. No thermal expansion offset is applied."
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_BEACON_UPDATE_NOZZLE_TEMP_OFFSET VARIABLE=active VALUE=True
        _BEACON_UPDATE_NOZZLE_TEMP_OFFSET
    {% endif %}

[gcode_macro BEACON_RESET_NOZZLE_TEMP_OFFSET]
description: Remove the thermal expansion Z offset and stop following the nozzle temperature
gcode:
    {% set s = printer["gcode_macro _BEACON_SETTINGS"] %}
    {% set me = printer["gcode_macro _BEACON_UPDATE_NOZZLE_TEMP_OFFSET"] %}
    {% set applied = me.applied_offset|float %}
    {% if applied > 0.000001 or applied < -0.000001 %}
        {% set move = 1 if 'z' in printer.toolhead.homed_axes else 0 %}
        SET_GCODE_OFFSET Z_ADJUST={-applied} MOVE={move} MOVE_SPEED={s.macro_z_speed|float}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_BEACON_UPDATE_NOZZLE_TEMP_OFFSET VARIABLE=applied_offset VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_BEACON_UPDATE_NOZZLE_TEMP_OFFSET VARIABLE=active VALUE=False

# ---------------------------------------------------------------------------
# Bed mesh
# ---------------------------------------------------------------------------
[gcode_macro BEACON_BED_MESH]
description: Bed mesh with the Beacon. Uses contact or proximity as configured. Extra parameters (PROFILE=, MESH_MIN= and so on) are passed on to BED_MESH_CALIBRATE.
gcode:
    {% set s = printer["gcode_macro _BEACON_SETTINGS"] %}
    {% set contact = s.beacon_contact_bed_mesh|string|lower == 'true' %}
    {% set automatic = s.beacon_scan_method_automatic|string|lower == 'true' %}
    {% set samples = s.beacon_contact_bed_mesh_samples|int %}
    {% set old_scv = printer.toolhead.square_corner_velocity|float %}

    _BEACON_MAYBE_HOME
    _BEACON_Z_HOP

    {% if contact %}
        BED_MESH_CALIBRATE PROBE_METHOD=contact USE_CONTACT_AREA=1 SAMPLES={samples} {rawparams}
    {% else %}
        SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={s.beacon_bed_mesh_scv|float}
        {% if automatic %}
            BED_MESH_CALIBRATE PROBE_METHOD=proximity METHOD=automatic {rawparams}
        {% else %}
            BED_MESH_CALIBRATE PROBE_METHOD=proximity {rawparams}
        {% endif %}
        SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={old_scv}
        # optional extra: add the scan compensation mesh to the proximity mesh
        {% if printer["gcode_macro BEACON_APPLY_SCAN_COMPENSATION_IF_ENABLED"] is defined %}
            BEACON_APPLY_SCAN_COMPENSATION_IF_ENABLED
        {% endif %}
    {% endif %}

# ---------------------------------------------------------------------------
# Z homing (use inside homing_override)
# ---------------------------------------------------------------------------
[gcode_macro BEACON_HOME_Z]
description: Home Z at the safe home position. Call it from homing_override only, never from other macros.
gcode:
    {% set s = printer["gcode_macro _BEACON_SETTINGS"] %}
    {% set contact = s.beacon_contact_z_homing|string|lower == 'true' %}
    _BEACON_MOVE_TO_SAFE_Z_HOME
    {% if contact %}
        BEACON_AUTO_CALIBRATE SKIP_MODEL_CREATION=1 SKIP_MULTIPOINT_PROBING=1
    {% else %}
        G28 Z
    {% endif %}
    _BEACON_Z_HOP

# ---------------------------------------------------------------------------
# Preflight check
# ---------------------------------------------------------------------------
[gcode_macro BEACON_PREFLIGHT_CHECK]
description: Check the Beacon macro configuration for common mistakes. Does not move anything.
gcode:
    {% set s = printer["gcode_macro _BEACON_SETTINGS"] %}
    {% set cfg = printer.configfile.settings %}
    {% set ns = namespace(problems=0) %}
    {% set true_zero = s.beacon_contact_start_print_true_zero|string|lower == 'true' %}
    {% set model_each = s.beacon_contact_calibrate_model_on_true_zero|string|lower == 'true' %}
    {% set fuzzy = s.beacon_contact_start_print_true_zero_fuzzy_position|string|lower == 'true' %}
    {% set comp = s.beacon_contact_expansion_compensation|string|lower == 'true' %}

    {% if printer.beacon is not defined %}
        _BEACON_ECHO TYPE=error TITLE="Preflight" MSG="No [beacon] section found."
        {% set ns.problems = ns.problems + 1 %}
    {% else %}
        {% if printer.beacon.model is none and not (true_zero and model_each) %}
            _BEACON_ECHO TYPE=error TITLE="Preflight" MSG="No Beacon model is active. Run BEACON_FULL_CALIBRATE, or enable variable_beacon_contact_calibrate_model_on_true_zero."
            {% set ns.problems = ns.problems + 1 %}
        {% endif %}
        {% if cfg.beacon.contact_max_hotend_temperature is defined %}
            {% if cfg.beacon.contact_max_hotend_temperature|float < s.beacon_contact_expansion_cal_temp_high|float and comp %}
                _BEACON_ECHO TYPE=warning TITLE="Preflight" MSG="contact_max_hotend_temperature in [beacon] is below variable_beacon_contact_expansion_cal_temp_high. BEACON_CALIBRATE_NOZZLE_TEMP_OFFSET will refuse to run."
                {% set ns.problems = ns.problems + 1 %}
            {% endif %}
            {% if cfg.beacon.contact_max_hotend_temperature|float < s.beacon_contact_true_zero_temp|float and true_zero %}
                _BEACON_ECHO TYPE=warning TITLE="Preflight" MSG="contact_max_hotend_temperature in [beacon] is below the true zero temperature. Contact probing will fail."
                {% set ns.problems = ns.problems + 1 %}
            {% endif %}
        {% endif %}
    {% endif %}

    {% if printer.save_variables is not defined %}
        _BEACON_ECHO TYPE=error TITLE="Preflight" MSG="No [save_variables] section. It is required to store the nozzle expansion coefficient."
        {% set ns.problems = ns.problems + 1 %}
    {% elif comp and true_zero and printer.save_variables.variables.nozzle_expansion_coefficient_t0 is not defined %}
        _BEACON_ECHO TYPE=warning TITLE="Preflight" MSG="No nozzle_expansion_coefficient_t0 saved yet. Run BEACON_CALIBRATE_NOZZLE_TEMP_OFFSET."
        {% set ns.problems = ns.problems + 1 %}
    {% endif %}

    {% if printer[s.extruder] is not defined %}
        _BEACON_ECHO TYPE=error TITLE="Preflight" MSG="variable_extruder in _BEACON_SETTINGS names an extruder that does not exist."
        {% set ns.problems = ns.problems + 1 %}
    {% endif %}

    {% if true_zero and s.beacon_contact_z_homing|string|lower == 'true' %}
        _BEACON_ECHO TYPE=warning TITLE="Preflight" MSG="Contact Z homing is on. Contact results can vary a lot on textured sheets."
    {% endif %}

    {% if true_zero and cfg.bed_mesh is defined %}
        {% if cfg.bed_mesh.zero_reference_position is not defined or cfg.bed_mesh.zero_reference_position is none %}
            _BEACON_ECHO TYPE=warning TITLE="Preflight" MSG="[bed_mesh] has no zero_reference_position. Set it to the safe home position so the mesh is referenced to the true zero point."
            {% set ns.problems = ns.problems + 1 %}
        {% elif fuzzy and s.beacon_contact_start_print_true_zero_fuzzy_radius|float > 0 %}
            _BEACON_ECHO TYPE=warning TITLE="Preflight" MSG="True zero uses a fuzzy position but [bed_mesh] has a fixed zero_reference_position. The mesh reference can be off by the local bed height difference within the fuzzy radius. Set the radius to 0 for exact results."
        {% endif %}
    {% endif %}

    # optional extras
    {% set want_scan = s.beacon_scan_compensation_enable|string|lower == 'true' %}
    {% set want_soak = s.beacon_adaptive_heat_soak|string|lower == 'true' %}
    {% if want_scan and cfg.beacon_scan_compensation is not defined %}
        _BEACON_ECHO TYPE=error TITLE="Preflight" MSG="Scan compensation is enabled but beacon_extras.cfg / the beacon_scan_compensation module is not installed."
        {% set ns.problems = ns.problems + 1 %}
    {% elif want_scan and not true_zero %}
        _BEACON_ECHO TYPE=warning TITLE="Preflight" MSG="Scan compensation is enabled but the true zero workflow is not. The compensation mesh needs a contact true zero."
        {% set ns.problems = ns.problems + 1 %}
    {% elif want_scan and cfg.bed_mesh is defined and (cfg.bed_mesh.zero_reference_position is not defined or cfg.bed_mesh.zero_reference_position is none) %}
        _BEACON_ECHO TYPE=warning TITLE="Preflight" MSG="Scan compensation works best with zero_reference_position set in [bed_mesh]."
    {% endif %}
    {% if want_soak and cfg.beacon_adaptive_heat_soak is not defined %}
        _BEACON_ECHO TYPE=error TITLE="Preflight" MSG="Adaptive heat soak is enabled but the beacon_adaptive_heat_soak module is not installed."
        {% set ns.problems = ns.problems + 1 %}
    {% endif %}
    {% if cfg.beacon_true_zero_correction is defined and true_zero %}
        {% if printer.beacon_offsets is not defined %}
            _BEACON_ECHO TYPE=error TITLE="Preflight" MSG="[beacon_true_zero_correction] needs [beacon_offsets]."
            {% set ns.problems = ns.problems + 1 %}
        {% endif %}
    {% endif %}

    # print start and end (beacon_print.cfg)
    {% if printer["gcode_macro START_PRINT"] is defined and printer["gcode_macro _BEACON_PRINT_STATE"] is defined %}
        {% if printer.virtual_sdcard is not defined %}
            _BEACON_ECHO TYPE=error TITLE="Preflight" MSG="START_PRINT needs a [virtual_sdcard] section (it provides SET_PRINT_STATS_INFO)."
            {% set ns.problems = ns.problems + 1 %}
        {% endif %}
        {% if cfg.bed_mesh is not defined and s.calibrate_bed_mesh|string|lower == 'true' %}
            _BEACON_ECHO TYPE=error TITLE="Preflight" MSG="START_PRINT makes a bed mesh but there is no [bed_mesh] section."
            {% set ns.problems = ns.problems + 1 %}
        {% endif %}
        {% if cfg.bed_mesh is defined and printer.beacon is defined and s.nozzle_priming|string|lower == 'primeblob' %}
            {% if cfg.bed_mesh.horizontal_move_z|default(5)|float < cfg.beacon.trigger_distance|default(2.0)|float %}
                _BEACON_ECHO TYPE=error TITLE="Preflight" MSG="horizontal_move_z in [bed_mesh] is below the Beacon trigger distance. Probing for the prime blob would fail."
                {% set ns.problems = ns.problems + 1 %}
            {% endif %}
        {% endif %}
        {% if s.nozzle_priming|string|lower not in ['primeblob', 'primeline', 'false'] %}
            _BEACON_ECHO TYPE=warning TITLE="Preflight" MSG="nozzle_priming is {s.nozzle_priming}. Use primeblob or false. Anything else is treated as no priming."
            {% set ns.problems = ns.problems + 1 %}
        {% endif %}
        {% if true_zero and printer.configfile.settings.beacon_zero_reference is not defined and (cfg.bed_mesh is not defined or cfg.bed_mesh.zero_reference_position is not defined or cfg.bed_mesh.zero_reference_position is none) %}
            _BEACON_ECHO TYPE=warning TITLE="Preflight" MSG="The print start cannot reference the mesh to the true zero: add [beacon_zero_reference] (beacon_extras.cfg) or zero_reference_position in [bed_mesh]."
            {% set ns.problems = ns.problems + 1 %}
        {% endif %}
    {% endif %}

    {% if ns.problems == 0 %}
        _BEACON_ECHO TYPE=success MSG="Beacon preflight check passed."
    {% else %}
        _BEACON_ECHO TYPE=warning MSG="Beacon preflight check found {ns.problems} issue(s)."
    {% endif %}
