# Filament load and unload macros in the style of RatOS
#
# Port of LOAD_FILAMENT / UNLOAD_FILAMENT from RatOS
# (github.com/Rat-OS/RatOS-configurator, configuration/macros/load_filament.cfg
# and unload_filament.cfg, GPL-3.0, Copyright (C) the RatOS contributors),
# for single extruder printers on stock Klipper or Kalico, without RatOS.
# Not Beacon specific: it only lives in this repo.
#
# Include it with:
#   [include beacon_macros/filament.cfg]
# Change settings by copying the [gcode_macro _FILAMENT_SETTINGS] lines you
# need into printer.cfg, AFTER the include, and editing them there.
#
# Differences from RatOS (single extruder path):
# - Left out: IDEX, filament sensors (insert, runout, clog), LEDs, the T0
#   frontend colour and filament data, M600 and COLD_PULL.
# - The macros switch to relative extrusion (M83) for their own moves and
#   restore the previous mode afterwards. RatOS relies on the mode already set.
# - Long moves are split to stay below max_extrude_only_distance of
#   [extruder] (Klipper default 50 mm), so no config change is needed for the
#   150 mm unload.
# This file may be distributed under the terms of the GNU GPLv3 license.


#####
# SETTINGS (RatOS defaults; measure your own extruder and hotend)
#####
[gcode_macro _FILAMENT_SETTINGS]
variable_default_temp: 220                            # TEMP= when none is given
variable_extruder_gear_to_cooling_position_distance: 30 # mm from the extruder gears to the end of the hotend cold zone
variable_cooling_position_to_nozzle_distance: 40      # mm from the cold zone to the nozzle (heatbreak length)
variable_filament_loading_nozzle_offset: -5           # added to the distance above when loading
variable_toolhead_sensor_to_extruder_gear_distance: 15 # only used to make the unload ejection long enough
variable_extruder_load_speed: 60                      # mm/s, gears to cold zone and back
variable_filament_load_speed: 10                      # mm/s, cold zone to nozzle
variable_purge_after_load: 0                          # mm to extrude after loading (with part fan), 0 = off
variable_purge_before_unload: 0                       # mm to extrude before unloading, 0 = off
variable_filament_unload_length: 150                  # mm pulled out by the standard unload
variable_enable_unload_tip_forming: False             # True: unload with RatOS tip forming instead of the standard unload
variable_purge_fan_speed: 0.4                         # part fan during the purge (only when homed)
gcode:


#####
# ENTRY POINTS
#####
[gcode_macro LOAD_FILAMENT]
description: Loads new filament. TEMP= (default 220). Inspect the tip of PETG before loading to avoid jams.
variable_ignore_min_extrude_temp: True                # needed for fluidd
gcode:
    {% set s = printer["gcode_macro _FILAMENT_SETTINGS"] %}
    {% set temp = params.TEMP|default(s.default_temp)|int %}

    _FILAMENT_ECHO MSG="Loading filament..."
    {% if printer["gcode_macro _USER_FILAMENT_LOADING"] is defined %}
        _USER_FILAMENT_LOADING
    {% endif %}

    SAVE_GCODE_STATE NAME=_filament_load_state
    M83
    _FILAMENT_HEAT TEMP={temp}

    # gears to the cold zone, fast
    _FILAMENT_ECHO MSG="Loading filament into hotend..."
    _FILAMENT_EXTRUDE E={s.extruder_gear_to_cooling_position_distance} SPEED={s.extruder_load_speed}
    M400
    _FILAMENT_ECHO MSG="Filament loaded into hotend."

    # cold zone to the nozzle, slow
    _FILAMENT_ECHO MSG="Loading filament into nozzle... Please wait!"
    _FILAMENT_EXTRUDE E={s.cooling_position_to_nozzle_distance + s.filament_loading_nozzle_offset} SPEED={s.filament_load_speed}
    G4 P1000
    _FILAMENT_PURGE E={s.purge_after_load}
    _FILAMENT_ECHO MSG="Filament loaded into nozzle!"

    RESTORE_GCODE_STATE NAME=_filament_load_state
    {% if printer["gcode_macro _USER_FILAMENT_LOADED"] is defined %}
        _USER_FILAMENT_LOADED
    {% endif %}
    _FILAMENT_ECHO MSG="Filament load routine complete, please check that the filament was loaded correctly."


[gcode_macro UNLOAD_FILAMENT]
description: Unloads the filament. TEMP= (default 220). Inspect the tip of PETG before reloading to avoid jams.
variable_ignore_min_extrude_temp: True                # needed for fluidd
gcode:
    {% set s = printer["gcode_macro _FILAMENT_SETTINGS"] %}
    {% set temp = params.TEMP|default(s.default_temp)|int %}
    {% set name = params._NAME|default('')|string %}
    {% set type = params._TYPE|default('')|string %}

    _FILAMENT_ECHO MSG="Unloading filament..."
    {% if printer["gcode_macro _USER_FILAMENT_UNLOADING"] is defined %}
        _USER_FILAMENT_UNLOADING
    {% endif %}

    SAVE_GCODE_STATE NAME=_filament_unload_state
    M83
    _FILAMENT_HEAT TEMP={temp}
    G4 P3000                    # make sure the filament is completely molten

    {% if s.enable_unload_tip_forming|string|lower == 'true' %}
        _FILAMENT_UNLOAD_WITH_TIP_FORMING NAME="{name}" TYPE="{type}"
    {% else %}
        _FILAMENT_STANDARD_UNLOAD
    {% endif %}

    RESTORE_GCODE_STATE NAME=_filament_unload_state
    {% if printer["gcode_macro _USER_FILAMENT_UNLOADED"] is defined %}
        _USER_FILAMENT_UNLOADED
    {% endif %}
    _FILAMENT_ECHO MSG="Filament unloading completed. Please inspect the tip of the filament before reloading."


#####
# UNLOAD
#####
[gcode_macro _FILAMENT_STANDARD_UNLOAD]
description: The default RatOS unload (its "legacy" unload)
gcode:
    {% set s = printer["gcode_macro _FILAMENT_SETTINGS"] %}
    _FILAMENT_PURGE_BEFORE_UNLOAD
    M117 Unloading filament...
    G0 E10 F300                 # extrude a bit
    G0 E-5 F3600                # pull back to the cold end
    G4 P3000                    # wait
    G0 E5 F6000                 # push back to smash any stringing
    G0 E-15 F6000               # pull back fast into the cold zone
    # continue slowly, so the filament solidifies before it reaches the gears
    _FILAMENT_EXTRUDE E={0 - s.filament_unload_length} SPEED=5
    M400
    M117 Filament unloaded!


[gcode_macro _FILAMENT_UNLOAD_WITH_TIP_FORMING]
description: RatOS unload with tip forming (variable_enable_unload_tip_forming: True)
gcode:
    {% set s = printer["gcode_macro _FILAMENT_SETTINGS"] %}
    {% set name = params.NAME|default('')|string %}
    {% set type = params.TYPE|default('')|string %}
    _FILAMENT_ECHO MSG="Unloading filament from nozzle to cooling zone... Please wait!"
    _FILAMENT_PURGE_BEFORE_UNLOAD
    {% if printer["gcode_macro _UNLOAD_WITHOUT_TIP_FORMING"] is defined %}
        # a user macro that replaces the built-in tip forming
        _UNLOAD_WITHOUT_TIP_FORMING NAME="{name}" TYPE="{type}"
    {% elif name != '' and type != '' %}
        _UNLOAD_KNOWN_FILAMENT NAME="{name}" TYPE="{type}"
    {% else %}
        _UNLOAD_UNKNOWN_FILAMENT
    {% endif %}
    G4 P3000                    # wait for the filament to solidify
    # eject past the extruder gears
    _FILAMENT_EXTRUDE E={0 - (s.extruder_gear_to_cooling_position_distance + s.toolhead_sensor_to_extruder_gear_distance + 50)} SPEED={s.extruder_load_speed}
    M400


[gcode_macro _UNLOAD_KNOWN_FILAMENT]
description: User overridable tip forming per slicer filament profile (NAME=, TYPE=)
gcode:
    {% set name = params.NAME|default('')|string %}
    {% set type = params.TYPE|default('')|string %}
    _FILAMENT_ECHO MSG="Filament type: {type}, profile: {name}"
    # Copy this macro into printer.cfg (after the include) and add your own
    # profiles, for example: if name == "My PETG", run
    # _TIP_FORMING RETRACT_LENGTH=18 COOLING_MOVE_LENGTH=10, else the line below.
    # The names are case sensitive and must match the slicer filament profile.
    _UNLOAD_UNKNOWN_FILAMENT


[gcode_macro _UNLOAD_UNKNOWN_FILAMENT]
description: User overridable standard tip forming
gcode:
    _TIP_FORMING RETRACT_LENGTH=18 COOLING_MOVE_LENGTH=10


[gcode_macro _TIP_FORMING]
description: RatOS tip forming: fast retract, cooling moves, optional dip
gcode:
    # cooling
    {% set cooling_moves = params.COOLING_MOVES|default(4)|int %}
    {% set cooling_move_length = params.COOLING_MOVE_LENGTH|default(10)|float %}
    {% set start_cooling_speed = params.START_COOLING_SPEED|default(10)|float * 60 %}
    {% set end_cooling_speed = params.END_COOLING_SPEED|default(50)|float * 60 %}
    {% if cooling_moves == 0 %}
        {% set cooling_move_length = 0 %}
    {% endif %}
    # dipping
    {% set dip = params.DIP|default('false')|lower == 'true' %}
    {% set dip_length = params.DIP_LENGTH|default(22)|float %}
    {% set dip_speed = params.DIP_SPEED|default(30)|float * 60 %}
    {% set dip_retract_speed = params.DIP_RETRACT_SPEED|default(70)|float * 60 %}
    # retraction
    {% set retract_length = params.RETRACT_LENGTH|default(18)|float %}
    {% set start_retract_speed = params.START_RETRACT_SPEED|default(120)|float * 60 %}
    {% set end_retract_speed = params.END_RETRACT_SPEED|default(20)|float * 60 %}

    M220 S100                   # reset any speed override
    M83
    # retraction
    {% set retract = retract_length + cooling_move_length / 2 - 15 %}
    G1 E-15 F{start_retract_speed}
    G1 E-{0.7 * retract} F{1.0 * end_retract_speed}
    G1 E-{0.2 * retract} F{0.5 * end_retract_speed}
    G1 E-{0.1 * retract} F{0.3 * end_retract_speed}
    # cooling
    {% if cooling_moves > 0 %}
        {% set i = (end_cooling_speed - start_cooling_speed) / (2 * cooling_moves - 1) %}
        {% for m in range(cooling_moves) %}
            G1 E{cooling_move_length} F{(start_cooling_speed + i * m * 2)}
            G1 E-{cooling_move_length} F{(start_cooling_speed + i * (m * 2 + 1))}
        {% endfor %}
    {% endif %}
    # dipping
    {% if dip %}
        G1 E{dip_length} F{dip_speed}
        G4 P100
        G1 E-{dip_length} F{dip_retract_speed}
    {% endif %}
    M400


#####
# HELPERS
#####
[gcode_macro _FILAMENT_HEAT]
gcode:
    {% set temp = params.TEMP|int %}
    {% if printer.extruder.temperature|int < temp or printer.extruder.can_extrude|lower == 'false' %}
        _FILAMENT_ECHO MSG="Heating extruder to {temp}C... Please wait."
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={temp}
    {% endif %}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp}


[gcode_macro _FILAMENT_EXTRUDE]
description: Relative extruder move of E mm at SPEED mm/s, split below max_extrude_only_distance
gcode:
    {% set e = params.E|float %}
    {% set f = params.SPEED|float * 60 %}
    {% set limit = printer.configfile.settings.extruder.max_extrude_only_distance|default(50)|float %}
    {% set chunk = [limit - 1, 1]|max %}
    {% set n = ((e|abs) / chunk)|round(0, 'ceil')|int %}
    {% if n > 0 %}
        {% set step = e / n %}
        {% for i in range(n) %}
            G1 E{step} F{f}
        {% endfor %}
    {% endif %}


[gcode_macro _FILAMENT_PURGE]
gcode:
    {% set s = printer["gcode_macro _FILAMENT_SETTINGS"] %}
    {% set e = params.E|default(0)|float %}
    {% if e > 0 %}
        {% if printer["gcode_macro _USER_BEFORE_PURGE_FILAMENT"] is defined %}
            _USER_BEFORE_PURGE_FILAMENT
        {% endif %}
        _FILAMENT_EXTRUDE E={e} SPEED=5
        M400
        {% if "xyz" in printer.toolhead.homed_axes %}
            M106 S{(255 * s.purge_fan_speed)|int}
        {% endif %}
        G4 P3000                # give the fan some time to spin up
        {% if "xyz" in printer.toolhead.homed_axes %}
            M106 S0
        {% endif %}
        {% if printer["gcode_macro _USER_AFTER_PURGE_FILAMENT"] is defined %}
            _USER_AFTER_PURGE_FILAMENT
        {% endif %}
    {% endif %}


[gcode_macro _FILAMENT_PURGE_BEFORE_UNLOAD]
gcode:
    {% set s = printer["gcode_macro _FILAMENT_SETTINGS"] %}
    {% if s.purge_before_unload|float > 0 %}
        _FILAMENT_EXTRUDE E={s.purge_before_unload} SPEED=5
        M400
    {% endif %}


[gcode_macro _FILAMENT_ECHO]
gcode:
    {action_respond_info(params.MSG|default(''))}
