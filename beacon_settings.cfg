# beacon_settings.cfg
#
# User settings for the standalone Beacon macro set.
#
# Variable names match the RatOS names (variable_beacon_*, variable_macro_*,
# variable_*_heat_soak_time), so values from an existing RatOS printer.cfg
# can be pasted in unchanged.
#
# To change a value without editing this file, redefine the section in your
# printer.cfg AFTER the [include] line and list only the variables you want
# to change, for example:
#
#   [gcode_macro _BEACON_SETTINGS]
#   variable_beacon_contact_true_zero_temp: 150
#
# NOTE: do not put a hash sign inside a value, Klipper treats it as a comment.

[gcode_macro _BEACON_SETTINGS]
description: Settings holder for the Beacon macro set. Edit the variables, running it does nothing.
gcode:
    { action_respond_info("_BEACON_SETTINGS only holds settings. See beacon_settings.cfg.") }

# ---------------------------------------------------------------------------
# General motion and heating
# ---------------------------------------------------------------------------
variable_extruder: "extruder"                           # name of the extruder section that carries the Beacon
variable_macro_travel_speed: 150                        # mm/s, XY travel moves made by these macros
variable_macro_z_speed: 15                              # mm/s, Z moves made by these macros
variable_z_hop: 15                                      # mm, absolute Z height used as the safe travel height
variable_z_hop_speed: 15                                # mm/s, speed of that Z move
variable_safe_home_x: "middle"                          # float or "middle", XY position used for contact probing
variable_safe_home_y: "middle"                          # float or "middle", (nozzle position, not probe position)
variable_bed_heat_soak_time: 0                          # seconds to soak after the bed reaches temperature (0 = none)
variable_hotend_heat_soak_time: 0                       # seconds to soak after the hotend reaches temperature (0 = none)
variable_debug: False                                   # print extra diagnostic lines to the console

# ---------------------------------------------------------------------------
# Calibration
# ---------------------------------------------------------------------------
variable_beacon_calibration_extruder_temp: 150          # nozzle temperature while calibrating the Beacon model
variable_beacon_contact_poke_bottom_limit: -1           # lower z limit for BEACON_POKE during the poke test and settling
variable_beacon_offset_measure_margin_x: 40             # mm from the X edges used by BEACON_MEASURE_BEACON_OFFSET
variable_beacon_offset_measure_margin_y: 40             # mm from the Y edges used by BEACON_MEASURE_BEACON_OFFSET

# ---------------------------------------------------------------------------
# Z homing and true zero
# ---------------------------------------------------------------------------
variable_beacon_contact_z_homing: False                 # BEACON_HOME_Z homes with contact instead of proximity.
                                                        # Not recommended on textured sheets because contact
                                                        # measurements can vary a lot there.
variable_beacon_contact_start_print_true_zero: True     # Use contact to find the true Z=0 once the bed is hot
                                                        # (BEACON_TRUE_ZERO). This is the recommended workflow.
variable_beacon_contact_start_print_true_zero_fuzzy_position: True
                                                        # Randomize the XY spot used for the true zero contact so the
                                                        # nozzle does not wear one point of the sheet.
variable_beacon_contact_start_print_true_zero_fuzzy_radius: 20
                                                        # mm, radius around the safe home position used when fuzzy
variable_beacon_contact_calibrate_model_on_true_zero: True
                                                        # Calibrate a fresh Beacon model at every true zero. With this
                                                        # on, no stored model is needed for printing.
variable_beacon_contact_wipe_before_true_zero: True     # Clean the nozzle tip with contact probes before true zero
variable_beacon_contact_wipe_before_true_zero_method: "probe_clean"
                                                        # only "probe_clean" is supported in this macro set
variable_beacon_contact_wipe_x: 50                      # mm, nozzle X of the first probe clean point
variable_beacon_contact_wipe_y: 10                      # mm, nozzle Y of the probe clean points
variable_beacon_contact_true_zero_temp: 170             # nozzle temperature for true zero and probe clean.
                                                        # WARNING: be careful with this on a smooth PEI sheet.

# ---------------------------------------------------------------------------
# Hotend thermal expansion compensation
# ---------------------------------------------------------------------------
variable_beacon_contact_expansion_compensation: True    # apply a Z offset that follows the nozzle temperature
variable_beacon_contact_expansion_cal_temp_low: 150     # BEACON_CALIBRATE_NOZZLE_TEMP_OFFSET lower temperature
variable_beacon_contact_expansion_cal_temp_high: 250    # BEACON_CALIBRATE_NOZZLE_TEMP_OFFSET upper temperature
                                                        # Must stay below contact_max_hotend_temperature in [beacon].

# ---------------------------------------------------------------------------
# Bed mesh
# ---------------------------------------------------------------------------
variable_beacon_bed_mesh_scv: 25                        # square corner velocity while meshing with proximity scans
variable_beacon_contact_bed_mesh: False                 # mesh with contact instead of proximity scans. Not recommended
                                                        # on textured sheets.
variable_beacon_contact_bed_mesh_samples: 2             # probe samples per point for a contact mesh
variable_beacon_scan_method_automatic: False            # use METHOD=automatic for proximity meshes (generally not
                                                        # recommended)

# ---------------------------------------------------------------------------
# Extras: scan compensation, adaptive heat soak, multi-point true zero
# These need the Python modules from klippy_extras/ and beacon_extras.cfg.
# Without them the settings below are ignored.
# ---------------------------------------------------------------------------
variable_beacon_scan_compensation_enable: False         # compensate proximity meshes with a contact based compensation mesh
variable_beacon_scan_compensation_profile: "auto"       # compensation mesh profile, "auto" picks the one closest to the bed temperature
variable_beacon_scan_compensation_desired_spacing: 10   # mm, spacing of the compensation mesh points
variable_beacon_scan_compensation_bed_temp_mismatch_is_error: False
                                                        # True: refuse to start when the compensation mesh bed temperature
                                                        # differs by more than 15 degrees. False: only warn.
variable_beacon_adaptive_heat_soak: False               # soak until the Beacon sees no more thermal drift, instead of a fixed time
variable_beacon_adaptive_heat_soak_min_wait: 0          # seconds, minimum time for the adaptive soak
variable_beacon_adaptive_heat_soak_max_wait: 5400       # seconds, give up waiting after this long
variable_beacon_adaptive_heat_soak_extra_wait_after_completion: 0
                                                        # seconds to keep waiting after the soak has completed
variable_beacon_adaptive_heat_soak_layer_quality: 3     # 1 rough, 2 draft, 3 normal, 4 high, 5 maximum. Higher quality
                                                        # tolerates less drift and so soaks longer.
variable_beacon_adaptive_heat_soak_maximum_first_layer_duration: 1800
                                                        # seconds, 60 to 7200. A longer first layer needs a longer soak.
