# beacon_common.cfg
#
# Shared helper macros used by the other Beacon macro files.
#
# Everything here only needs stock Klipper (or Kalico) plus the Beacon module.
# The macros are written in plain Jinja (no math module, no do extension) so
# they also load on stock Klipper.
#
# Authoring rule for this whole macro set: Klipper strips everything after a
# hash sign on every config line, even inside a macro, so comments inside macros
# are always whole lines starting with a hash sign. Never use Jinja comment
# tags or a hash sign inside a string.

# ---------------------------------------------------------------------------
# Console output
# ---------------------------------------------------------------------------
[gcode_macro _BEACON_ECHO]
description: Console output. MSG=text (use _N_ for a line break), TITLE=text, TYPE=info|success|warning|alert|error
gcode:
    {% set title = params.TITLE|default("") %}
    {% set type = params.TYPE|default("info")|lower %}
    {% set text = params.MSG|default("")|replace("_N_", "\n")|replace('"', "'") %}
    {% set lines = text.split("\n") %}
    {% if title %}
        {% set lines = [title ~ ":"] + lines %}
    {% endif %}
    {% set has_respond = printer.configfile.settings.respond is defined %}
    {% for line in lines %}
        {% if has_respond and type in ["warning", "alert", "error"] %}
            RESPOND TYPE={"error" if type in ["alert", "error"] else "echo"} MSG="{line}"
        {% else %}
            { action_respond_info(line) }
        {% endif %}
    {% endfor %}

[gcode_macro _BEACON_DEBUG]
description: Console output that only shows when variable_debug is True in _BEACON_SETTINGS
gcode:
    {% if printer["gcode_macro _BEACON_SETTINGS"].debug|string|lower == 'true' %}
        _BEACON_ECHO TITLE="BEACON DEBUG" TYPE=info MSG="{params.MSG|default('')}"
    {% endif %}

# ---------------------------------------------------------------------------
# User hooks
#
# These do nothing by default. To connect your own LEDs or chamber heater,
# redefine the macro in your printer.cfg after the include, for example:
#
#   [gcode_macro _BEACON_HOOK_CHAMBER_ON]
#   gcode:
#       M141 S{params.CHAMBER_TEMP|default(0)|int}
#       M191 S{params.CHAMBER_TEMP|default(0)|int}
# ---------------------------------------------------------------------------
[gcode_macro _BEACON_HOOK_LED_START]
description: Called when a Beacon calibration starts
gcode:
    {% set unused = 0 %}

[gcode_macro _BEACON_HOOK_LED_END]
description: Called when a Beacon calibration finished successfully
gcode:
    {% set unused = 0 %}

[gcode_macro _BEACON_HOOK_LED_ERROR]
description: Called when a Beacon calibration or check failed
gcode:
    {% set unused = 0 %}

[gcode_macro _BEACON_HOOK_CHAMBER_ON]
description: Called to heat the chamber. Receives CHAMBER_TEMP
gcode:
    {% set unused = 0 %}

[gcode_macro _BEACON_HOOK_CHAMBER_OFF]
description: Called to switch the chamber heating off
gcode:
    {% set unused = 0 %}

# ---------------------------------------------------------------------------
# Movement helpers
# ---------------------------------------------------------------------------
[gcode_macro _BEACON_Z_HOP]
description: Move to the safe travel height (variable_z_hop). Does nothing while Z is not homed.
gcode:
    {% set s = printer["gcode_macro _BEACON_SETTINGS"] %}
    {% if 'z' in printer.toolhead.homed_axes %}
        G0 Z{s.z_hop|float} F{s.z_hop_speed|float * 60}
    {% endif %}

[gcode_macro _BEACON_MOVE_TO_SAFE_Z_HOME]
description: Move the nozzle to the safe home position. Z_HOP=1 raises Z first, FUZZY_RADIUS=mm randomizes the position.
gcode:
    {% set s = printer["gcode_macro _BEACON_SETTINGS"] %}
    {% set tp = printer.toolhead %}
    {% set speed = s.macro_travel_speed|float * 60 %}
    {% set z_hop = params.Z_HOP|default('0')|string|lower in ['1', 'true', 'yes'] %}
    {% set radius = params.FUZZY_RADIUS|default(0)|float %}

    # safe home position, "middle" means the middle of the XY axis range
    {% if s.safe_home_x|string|lower == 'middle' %}
        {% set x = (tp.axis_minimum.x + tp.axis_maximum.x) / 2 %}
    {% else %}
        {% set x = s.safe_home_x|float %}
    {% endif %}
    {% if s.safe_home_y|string|lower == 'middle' %}
        {% set y = (tp.axis_minimum.y + tp.axis_maximum.y) / 2 %}
    {% else %}
        {% set y = s.safe_home_y|float %}
    {% endif %}

    # optional fuzzy position: pseudo-random point in a disk around the safe home position.
    # The random numbers come from the fractional digits of the printer clock. Two attempts
    # at rejection sampling, then the point is pulled back onto the circle if needed.
    {% if radius > 0 %}
        {% set t = tp.estimated_print_time|float %}
        {% set dx = (((t * 1000) % 1) * 2 - 1) * radius %}
        {% set dy = (((t * 1000000) % 1) * 2 - 1) * radius %}
        {% if dx * dx + dy * dy > radius * radius %}
            {% set dx = (((t * 10000) % 1) * 2 - 1) * radius %}
            {% set dy = (((t * 100000) % 1) * 2 - 1) * radius %}
        {% endif %}
        {% set d2 = dx * dx + dy * dy %}
        {% if d2 > radius * radius %}
            {% set k = radius / (d2 ** 0.5) %}
            {% set dx = dx * k %}
            {% set dy = dy * k %}
        {% endif %}
        {% set x = [[x + dx, tp.axis_minimum.x]|max, tp.axis_maximum.x]|min %}
        {% set y = [[y + dy, tp.axis_minimum.y]|max, tp.axis_maximum.y]|min %}
    {% endif %}

    _BEACON_DEBUG MSG="move to safe home x={x|round(3)} y={y|round(3)} z_hop={z_hop} fuzzy_radius={radius}"
    {% if z_hop %}
        _BEACON_Z_HOP
    {% endif %}
    G0 X{x} Y{y} F{speed}

# ---------------------------------------------------------------------------
# Homing and leveling
# ---------------------------------------------------------------------------
[gcode_macro _BEACON_MAYBE_HOME]
description: Home only the axes that are not homed yet. Pass X, Y and or Z to limit the check, no parameter checks all.
gcode:
    {% set ns = namespace(requested=[], todo=[]) %}
    {% if params.X is defined %}{% set ns.requested = ns.requested + ['x'] %}{% endif %}
    {% if params.Y is defined %}{% set ns.requested = ns.requested + ['y'] %}{% endif %}
    {% if params.Z is defined %}{% set ns.requested = ns.requested + ['z'] %}{% endif %}
    {% if ns.requested|length == 0 %}
        {% set ns.requested = ['x', 'y', 'z'] %}
    {% endif %}
    {% for axis in ns.requested %}
        {% if axis not in printer.toolhead.homed_axes %}
            {% set ns.todo = ns.todo + [axis|upper] %}
        {% endif %}
    {% endfor %}
    {% if ns.todo|length > 0 %}
        _BEACON_ECHO MSG="Homing {ns.todo|join(' ')}"
        G28 {ns.todo|join(' ')}
    {% else %}
        _BEACON_DEBUG MSG="All requested axes already homed"
    {% endif %}

[gcode_macro _BEACON_HOME_AND_ABL]
description: Home X/Y, set Z with a contact probe and run Z tilt or quad gantry leveling if configured and not applied yet
gcode:
    # home X/Y if needed and go to the safe home position
    _BEACON_MAYBE_HOME X=1 Y=1
    _BEACON_MOVE_TO_SAFE_Z_HOME Z_HOP=1

    # set Z with contact. Skip model creation, an existing model is kept.
    BEACON_AUTO_CALIBRATE SKIP_MODEL_CREATION=1 SKIP_MULTIPOINT_PROBING=1

    # automatic bed leveling
    {% set ns = namespace(needs_rehoming=False) %}
    {% if printer.z_tilt is defined and not printer.z_tilt.applied %}
        _BEACON_ECHO MSG="Adjusting Z tilt..."
        Z_TILT_ADJUST
        _BEACON_ECHO MSG="Rehoming Z after Z tilt adjustment..."
        {% set ns.needs_rehoming = True %}
    {% endif %}
    {% if printer.quad_gantry_level is defined and not printer.quad_gantry_level.applied %}
        _BEACON_ECHO MSG="Running quad gantry leveling..."
        QUAD_GANTRY_LEVEL
        _BEACON_ECHO MSG="Rehoming Z after quad gantry leveling..."
        {% set ns.needs_rehoming = True %}
    {% endif %}

    _BEACON_MOVE_TO_SAFE_Z_HOME Z_HOP=1

    # Z changes after leveling, so set it again
    {% if ns.needs_rehoming %}
        BEACON_AUTO_CALIBRATE SKIP_MODEL_CREATION=1 SKIP_MULTIPOINT_PROBING=1
    {% endif %}
