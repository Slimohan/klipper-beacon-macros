# beacon_extras.cfg
#
# The optional extras of the Beacon macro set:
#   scan compensation       contact based correction of fast proximity bed meshes
#   adaptive heat soak      waits until the Beacon sees no more thermal drift
#   multi-point true zero   robust contact Z=0 from several probe points
#
# These need the Python modules in klippy_extras/. Copy or link them into the
# klippy/extras folder of Klipper or Kalico (install.sh does that), restart, and
# include this file AFTER beacon_macros.cfg:
#
#   [include beacon_macros/beacon_macros.cfg]
#   [include beacon_macros/beacon_extras.cfg]
#
# Do not include this file without the Python modules: Klipper would stop with
# "Section 'beacon_offsets' is not valid".
#
# Based on the Beacon macros and Klipper extras of RatOS (GPL-3.0). See README.md.
#
# Module options can be changed by repeating a section in your printer.cfg after
# the include and listing only the options you want to change, for example:
#
#   [beacon_true_zero_correction]
#   sampling_strategy: 2

# ---------------------------------------------------------------------------
# Python modules
# ---------------------------------------------------------------------------
[beacon_offsets]
# named offsets used by the multi-point true zero correction

[beacon_true_zero_correction]
# multi-point probing after BEACON_AUTO_CALIBRATE. Options (defaults shown):
# disabled: False
# z_rejection_threshold: 0.075
# low_z_rejection_threshold: -0.15
# max_retries: 10
# sampling_strategy: 1

[beacon_adaptive_heat_soak]
# default_layer_quality: 3
# default_maximum_first_layer_duration: 1800
# default_maximum_wait: 5400
# default_minimum_wait: 0

[beacon_scan_compensation]
# default_desired_spacing: 10

# ---------------------------------------------------------------------------
# Heat soak
# ---------------------------------------------------------------------------
[gcode_macro BEACON_HEAT_SOAK]
description: Wait for the bed to expand. Adaptive (Beacon) when enabled in _BEACON_SETTINGS, otherwise the fixed bed_heat_soak_time. Call after the bed has reached temperature.
gcode:
    {% set s = printer["gcode_macro _BEACON_SETTINGS"] %}
    {% set z_speed = s.macro_z_speed|float * 60 %}
    {% set want_adaptive = s.beacon_adaptive_heat_soak|string|lower == 'true' %}
    {% set have_module = printer.configfile.settings.beacon_adaptive_heat_soak is defined %}
    {% set extra = s.beacon_adaptive_heat_soak_extra_wait_after_completion|int %}
    {% set max_wait = [s.beacon_adaptive_heat_soak_max_wait|int, params._MIN_MAX_WAIT|default(0)|int]|max %}
    {% set fixed = s.bed_heat_soak_time|int %}

    {% if want_adaptive and not have_module %}
        _BEACON_ECHO TYPE=warning TITLE="Adaptive heat soak" MSG="Adaptive heat soak is enabled but the beacon_adaptive_heat_soak module is not installed. Using the fixed bed_heat_soak_time instead."
    {% endif %}

    {% if want_adaptive and have_module %}
        _BEACON_MAYBE_HOME
        _BEACON_MOVE_TO_SAFE_Z_HOME
        # the nozzle must be close to the bed for soaking and for the Beacon readings
        G1 Z2.5 F{z_speed}
        {% if params._FORCE_THRESHOLD is defined %}
            BEACON_WAIT_FOR_PRINTER_HEAT_SOAK _FORCE_THRESHOLD={params._FORCE_THRESHOLD|int} MINIMUM_WAIT={s.beacon_adaptive_heat_soak_min_wait|int} MAXIMUM_WAIT={max_wait}
        {% else %}
            BEACON_WAIT_FOR_PRINTER_HEAT_SOAK LAYER_QUALITY={s.beacon_adaptive_heat_soak_layer_quality|int} MAXIMUM_FIRST_LAYER_DURATION={s.beacon_adaptive_heat_soak_maximum_first_layer_duration|int} MINIMUM_WAIT={s.beacon_adaptive_heat_soak_min_wait|int} MAXIMUM_WAIT={max_wait}
        {% endif %}
        {% if extra > 0 %}
            _BEACON_ECHO MSG="Waiting for an additional {extra} seconds after heat soak completion..."
            G4 P{extra * 1000}
        {% endif %}
    {% elif fixed > 0 %}
        _BEACON_ECHO MSG="Heat soaking bed for {fixed} seconds..."
        G4 P{fixed * 1000}
    {% endif %}

# ---------------------------------------------------------------------------
# Scan compensation
# ---------------------------------------------------------------------------
[gcode_macro BEACON_CREATE_SCAN_COMPENSATION_MESH]
description: Create a scan compensation mesh from contact and proximity probes. BED_TEMP=85 CHAMBER_TEMP=0 PROFILE=auto KEEP_TEMP_MESHES=0. Finishes with SAVE_CONFIG unless run from BEACON_FULL_CALIBRATE.
gcode:
    {% set s = printer["gcode_macro _BEACON_SETTINGS"] %}
    {% set bed_temp = params.BED_TEMP|default(85)|int %}
    {% set chamber_temp = params.CHAMBER_TEMP|default(0)|int %}
    {% set profile = params.PROFILE|default("auto")|string %}
    {% set keep_temp_meshes = params.KEEP_TEMP_MESHES|default(0)|int %}
    {% set automated = params._AUTOMATED|default('0')|string|lower in ['1', 'true', 'yes'] %}
    {% set true_zero = s.beacon_contact_start_print_true_zero|string|lower == 'true' %}
    {% set model_on_true_zero = s.beacon_contact_calibrate_model_on_true_zero|string|lower == 'true' %}
    {% set cal_temp = s.beacon_calibration_extruder_temp|int %}
    {% set z_speed = s.macro_z_speed|float * 60 %}
    {% set hotend_soak = s.hotend_heat_soak_time|int %}
    {% set enabled = s.beacon_scan_compensation_enable|string|lower == 'true' %}
    {% set have_module = printer.configfile.settings.beacon_scan_compensation is defined %}
    {% set fresh_model = true_zero and model_on_true_zero %}

    {% if not have_module %}
        { action_raise_error("The beacon_scan_compensation module is not installed. See README.md, section Extras.") }
    {% endif %}

    {% if not enabled %}
        _BEACON_ECHO MSG="Beacon scan compensation is disabled! Set variable_beacon_scan_compensation_enable: True in _BEACON_SETTINGS."
    {% else %}
        _BEACON_MAYBE_HOME
        _BEACON_MOVE_TO_SAFE_Z_HOME Z_HOP=1
        _BEACON_HOOK_LED_START

        {% if chamber_temp > 0 %}
            _BEACON_HOOK_CHAMBER_ON CHAMBER_TEMP={chamber_temp}
        {% endif %}

        # heat up
        SET_HEATER_TEMPERATURE HEATER={s.extruder} TARGET={cal_temp}
        SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bed_temp}
        _BEACON_ECHO MSG="Please wait..."
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed_temp} MAXIMUM={bed_temp + 5}
        TEMPERATURE_WAIT SENSOR={s.extruder} MINIMUM={cal_temp} MAXIMUM={cal_temp + 5}

        # true zero on the hot bed
        {% if fresh_model %}
            BEACON_AUTO_CALIBRATE SKIP_MULTIPOINT_PROBING=1
        {% else %}
            BEACON_AUTO_CALIBRATE SKIP_MODEL_CREATION=1 SKIP_MULTIPOINT_PROBING=1
        {% endif %}

        # wait for the bed to expand. A fairly generous threshold is enough here,
        # the cotemporal probing tolerates some remaining drift.
        _BEACON_MOVE_TO_SAFE_Z_HOME
        G1 Z2.5 F{z_speed}
        BEACON_HEAT_SOAK _FORCE_THRESHOLD=100 _MIN_MAX_WAIT=9000
        {% if not (s.beacon_adaptive_heat_soak|string|lower == 'true' or s.bed_heat_soak_time|int > 0) and hotend_soak > 0 %}
            _BEACON_ECHO MSG="Heat soaking hotend for {hotend_soak} seconds..."
            G4 P{hotend_soak * 1000}
        {% endif %}

        # leveling is forced, the compensation mesh needs a level gantry
        {% if printer.z_tilt is defined %}
            _BEACON_ECHO MSG="Adjusting Z tilt..."
            Z_TILT_ADJUST
        {% endif %}
        {% if printer.quad_gantry_level is defined %}
            _BEACON_ECHO MSG="Running quad gantry leveling..."
            QUAD_GANTRY_LEVEL
        {% endif %}

        # set Z again right before probing, with the same nozzle temperature
        _BEACON_MOVE_TO_SAFE_Z_HOME Z_HOP=1
        {% if fresh_model %}
            BEACON_AUTO_CALIBRATE SKIP_MULTIPOINT_PROBING=1
        {% else %}
            {% if printer.beacon.model is none %}
                { action_raise_error("No active Beacon model. Run BEACON_INITIAL_CALIBRATION first.") }
            {% endif %}
            BEACON_AUTO_CALIBRATE SKIP_MODEL_CREATION=1 SKIP_MULTIPOINT_PROBING=1
        {% endif %}

        _BEACON_CREATE_SCAN_COMPENSATION_MESH_CORE PROFILE="{profile}" DESIRED_SPACING={s.beacon_scan_compensation_desired_spacing|float} CHAMBER_TEMP={chamber_temp} KEEP_TEMP_MESHES={keep_temp_meshes}

        {% if not automated %}
            SET_HEATER_TEMPERATURE HEATER={s.extruder} TARGET=0
            SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0
            {% if chamber_temp > 0 %}
                _BEACON_HOOK_CHAMBER_OFF
            {% endif %}
        {% else %}
            # leave the printer homed with a valid Z for the steps that follow
            _BEACON_MOVE_TO_SAFE_Z_HOME Z_HOP=1
            BEACON_AUTO_CALIBRATE SKIP_MODEL_CREATION=1 SKIP_MULTIPOINT_PROBING=1
        {% endif %}

        _BEACON_ECHO TYPE=success MSG="Beacon scan compensation mesh created!"
        {% if not automated %}
            _BEACON_HOOK_LED_END
            _BEACON_ECHO MSG="Saving config and restarting Klipper..."
            SAVE_CONFIG
        {% endif %}
    {% endif %}

[gcode_macro BEACON_APPLY_SCAN_COMPENSATION_IF_ENABLED]
description: Apply the configured scan compensation profile to the loaded proximity mesh, if enabled
gcode:
    {% set s = printer["gcode_macro _BEACON_SETTINGS"] %}
    {% if s.beacon_scan_compensation_enable|string|lower == 'true' %}
        {% if printer.configfile.settings.beacon_scan_compensation is defined %}
            BEACON_APPLY_SCAN_COMPENSATION PROFILE="{s.beacon_scan_compensation_profile}"
        {% else %}
            _BEACON_ECHO TYPE=warning TITLE="Scan compensation" MSG="Scan compensation is enabled but the beacon_scan_compensation module is not installed."
        {% endif %}
    {% endif %}

[gcode_macro BEACON_PREFLIGHT_SCAN_COMPENSATION]
description: Raise an error before a print starts when scan compensation is enabled but its mesh is missing. BED_TEMP= (default: current bed temperature)
gcode:
    {% set s = printer["gcode_macro _BEACON_SETTINGS"] %}
    {% set bed_temp = params.BED_TEMP|default(0)|float %}
    {% if bed_temp == 0 %}
        {% set bed_temp = printer.heater_bed.temperature %}
    {% endif %}
    {% if s.beacon_scan_compensation_enable|string|lower == 'true' and printer.configfile.settings.beacon_scan_compensation is defined %}
        _BEACON_VALIDATE_COMPENSATION_MESH_PROFILE PROFILE="{s.beacon_scan_compensation_profile}" TITLE="Check Beacon scan compensation profile" SUBJECT="Configured compensation profile '{s.beacon_scan_compensation_profile}'" COMPARE_BED_TEMP={bed_temp} COMPARE_BED_TEMP_IS_ERROR={s.beacon_scan_compensation_bed_temp_mismatch_is_error}
    {% endif %}
